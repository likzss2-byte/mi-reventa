<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Reventa</title>
<meta name="description" content="Control de inventario y caja para reventa de ropa.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Reventa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2EFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17131C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" href="icono.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Albert+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style id="app-style">
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#F2EFF4;--surface:#FFFFFF;--surface-2:#F7F4FA;--border:#E2DCE9;
  --text:#221B28;--text-muted:#6D6377;
  --accent:#9A2F55;--accent-hover:#7E2544;--accent-contrast:#FFFFFF;
  --success:#2C7A57;--success-bg:#E0F1E8;
  --info:#3A6BA5;--info-bg:#E3ECF7;
  --danger:#B03F38;--danger-bg:#F8E6E4;
  --warn:#8A6218;--warn-bg:#F7EEDA;
  --toast-bg:#221B28;--toast-fg:#F2EFF4;
  --shadow:0 1px 2px rgba(34,27,40,.06),0 6px 16px rgba(34,27,40,.07);
  --radius:16px;--radius-sm:10px;
  --font-display:'Big Shoulders Display',system-ui,sans-serif;
  --font-body:'Albert Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'Space Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17131C;--surface:#211B27;--surface-2:#2A2331;--border:#3B3342;
    --text:#F1ECF5;--text-muted:#AEA4BA;
    --accent:#EB98B8;--accent-hover:#F2ADC6;--accent-contrast:#25101A;
    --success:#72CDA0;--success-bg:rgba(114,205,160,.15);
    --info:#8CB6E2;--info-bg:rgba(140,182,226,.15);
    --danger:#E4938B;--danger-bg:rgba(228,147,139,.15);
    --warn:#E0BE79;--warn-bg:rgba(224,190,121,.15);
    --toast-bg:#F1ECF5;--toast-fg:#17131C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#17131C;--surface:#211B27;--surface-2:#2A2331;--border:#3B3342;
  --text:#F1ECF5;--text-muted:#AEA4BA;
  --accent:#EB98B8;--accent-hover:#F2ADC6;--accent-contrast:#25101A;
  --success:#72CDA0;--success-bg:rgba(114,205,160,.15);
  --info:#8CB6E2;--info-bg:rgba(140,182,226,.15);
  --danger:#E4938B;--danger-bg:rgba(228,147,139,.15);
  --warn:#E0BE79;--warn-bg:rgba(224,190,121,.15);
  --toast-bg:#F1ECF5;--toast-fg:#17131C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
.app{min-height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--font-body);font-weight:600;font-size:9.5px;letter-spacing:.13em;color:var(--text-muted);text-transform:uppercase;margin-top:3px}
.topbar-total{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:999px;background:var(--info-bg);color:var(--info);white-space:nowrap}
.topbar-total.neg{background:var(--danger-bg);color:var(--danger)}
.content{flex:1;padding:16px 16px 104px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar-inner{display:flex;width:100%;max-width:640px}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:10px 1px 9px;cursor:pointer;color:var(--text-muted);font-size:9.5px;font-weight:600;letter-spacing:0}
.tab-btn .ic{font-size:18px;line-height:1}
.tab-btn[aria-selected="true"]{color:var(--accent)}
.tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:8px}
h2{font-family:var(--font-display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:.02em}
.section-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin:0 0 12px}
.hero-tile+.section-title,.stat-grid+.section-title,.bar-compare+.section-title,.cap-box+.section-title,.gasto-list+.section-title,.hint+.section-title,.btn+.section-title{margin-top:26px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;width:100%;padding:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-photo{aspect-ratio:1/1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:30px}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px}
.card-name{font-weight:700;font-size:14px;line-height:1.25}
.card-meta{font-size:11.5px;color:var(--text-muted)}
.card-prices{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card-price{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;width:fit-content}
.pill.stock{background:var(--info-bg);color:var(--info)}
.pill.agotado{background:var(--success-bg);color:var(--success)}
.pill.inicial{background:var(--warn-bg);color:var(--warn)}
.gain-pos{color:var(--success);font-weight:700}
.gain-neg{color:var(--danger);font-weight:700}
.empty{text-align:center;padding:44px 20px;color:var(--text-muted);font-size:14px;line-height:1.6}
.empty .ic{font-size:38px;display:block;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-contrast);border:none;padding:13px 20px;border-radius:var(--radius-sm);font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn:active{background:var(--accent-hover)}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.solid-danger{background:var(--danger);color:#fff}
.btn.inline{width:auto;padding:12px 22px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.field label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px;font-size:16px;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-row{display:flex;align-items:flex-start;gap:11px;background:var(--warn-bg);border-radius:var(--radius-sm);padding:13px;margin-bottom:15px;cursor:pointer}
.check-row input{width:21px;height:21px;margin:0;flex-shrink:0;accent-color:var(--accent)}
.check-row .ct{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.check-row .cs{display:block;font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.4}
.photo-picker{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:15px;text-align:center;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;background:var(--surface-2);display:block}
.photo-picker input{display:none}
.photo-strip{display:flex;gap:8px;flex-wrap:wrap}
.photo-strip:empty{display:none}
.photo-thumb{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb button{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;padding:0}
.talla-rows{display:flex;flex-direction:column;gap:8px}
.talla-row{display:flex;gap:8px;align-items:center}
.talla-row input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;font-size:16px;min-width:0}
.talla-row .t-name{flex:1}
.talla-row .t-qty{width:78px;text-align:center;font-variant-numeric:tabular-nums}
.talla-row .t-sold{font-size:10.5px;color:var(--text-muted);white-space:nowrap;width:76px}
.talla-row .t-del{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.row-add{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:8px 0;text-align:left;width:fit-content}
.hero-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border-left:5px solid var(--accent)}
.hero-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin-bottom:8px}
.hero-value{font-family:var(--font-mono);font-weight:700;font-size:33px;font-variant-numeric:tabular-nums;line-height:1}
.hero-value.neg{color:var(--danger)}
.hero-sub{font-size:12px;color:var(--text-muted);margin-top:9px;line-height:1.55}
.hero-note{font-size:11.5px;color:var(--warn);margin-top:7px;line-height:1.45;font-weight:600}
.cap-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;display:flex;align-items:center;gap:10px;margin-top:12px}
.cap-box label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);flex:1}
.cap-box input{width:118px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.cap-box input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:7px}
.stat-value{font-family:var(--font-mono);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.stat-value.success{color:var(--success)}
.stat-value.danger{color:var(--danger)}
.stat-value.info{color:var(--info)}
.stat-value.warn{color:var(--warn)}
.bar-compare{margin-bottom:4px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{width:82px;font-size:12px;color:var(--text-muted);font-weight:600;flex-shrink:0}
.bar-track{flex:1;height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;min-width:2px}
.bar-fill.cost{background:var(--info)}
.bar-fill.rev{background:var(--success)}
.bar-fill.exp{background:var(--warn)}
.bar-value{font-family:var(--font-mono);font-size:11.5px;width:78px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.sale-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.sale-item:last-child{border-bottom:none}
.sale-name{font-weight:600;font-size:14px}
.sale-date{font-size:11px;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sale-gain{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sale-gain.pos{color:var(--success)}
.sale-gain.neg{color:var(--danger)}
.venta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.venta-row:last-child{border-bottom:none}
.venta-main{font-size:13.5px;font-weight:600}
.venta-date{font-size:11px;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.venta-total{font-family:var(--font-mono);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.venta-undo{background:none;border:none;color:var(--text-muted);font-size:11.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:2px 0}
.gasto-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px 14px}
.gasto-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.gasto-row:last-child{border-bottom:none}
.gasto-info{min-width:0}
.gasto-name{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.gasto-meta{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gasto-cat{background:var(--surface-2);border-radius:999px;padding:2px 8px;font-weight:700;letter-spacing:.03em}
.gasto-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.gasto-monto{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--warn);white-space:nowrap}
.gasto-monto.entra{color:var(--success)}
.gasto-del{background:none;border:none;color:var(--text-muted);font-size:19px;cursor:pointer;padding:0 2px;line-height:1}
.gasto-del.armed{color:var(--danger);font-size:11.5px;font-weight:700;text-decoration:underline}
.linkrow{display:flex;justify-content:flex-end;margin:-9px 0 15px}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;padding:4px 0;text-decoration:underline}
.prov-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;margin-bottom:10px}
.prov-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prov-top input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:16px;font-weight:600}
.prov-top input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.prov-del{background:none;border:none;color:var(--text-muted);font-size:19px;cursor:pointer;padding:0 3px;line-height:1;flex-shrink:0}
.prov-del.armed{color:var(--danger);font-size:11.5px;font-weight:700;text-decoration:underline;white-space:nowrap}
.prov-contacto{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:15px}
.prov-contacto:focus{outline:2px solid var(--accent);outline-offset:-1px}
.prov-stats{font-size:11.5px;color:var(--text-muted);margin-top:8px;font-variant-numeric:tabular-nums}
.prov-card .btn.secondary{background:var(--surface)}
.prov-card .btn.secondary:active{background:var(--bg)}
.card.pick{position:relative}
.card.pick[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pick-mark{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:transparent}
.card.pick[aria-pressed="true"] .pick-mark{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.pick-bar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0));z-index:12;display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.pick-bar .btn{max-width:608px;pointer-events:auto;box-shadow:0 4px 18px rgba(0,0,0,.28)}
.title-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.vi-row{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--border)}
.vi-row:last-of-type{border-bottom:none}
.vi-foto{width:52px;height:52px;border-radius:9px;object-fit:cover;background:var(--surface-2);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.vi-body{flex:1;min-width:0}
.vi-name{font-weight:700;font-size:14px;margin-bottom:7px;line-height:1.25}
.vi-fields{display:grid;grid-template-columns:1fr 62px 86px;gap:7px}
.vi-fields label{display:block;min-width:0}
.vi-fields select,.vi-fields input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 8px;font-size:15px;min-width:0;width:100%}
.vi-fields select:focus,.vi-fields input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.vi-cap{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:3px}
.vi-del{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:0 2px;line-height:1;align-self:center}
.tot-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;margin:15px 0}
.tot-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13.5px;padding:4px 0;color:var(--text-muted)}
.tot-row b{font-family:var(--font-mono);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.tot-row.big{border-top:1px solid var(--border);margin-top:7px;padding-top:10px;font-weight:700;color:var(--text)}
.tot-row.big b{font-size:17px}
.tot-row.debe b{color:var(--warn)}
.check-row.plain{background:var(--info-bg)}
.ap-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px;width:100%;text-align:left;cursor:pointer;display:block}
.ap-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ap-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ap-cliente{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.ap-nums{display:flex;gap:18px;flex-wrap:wrap}
.ap-num b{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:3px}
.ap-num span{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.ap-num span.debe{color:var(--warn)}
.ap-foot{font-size:11.5px;color:var(--text-muted);margin-top:10px}
.ap-foot.urge{color:var(--danger);font-weight:700}
.pill.activo{background:var(--info-bg);color:var(--info)}
.pill.pronto{background:var(--warn-bg);color:var(--warn)}
.pill.vencido{background:var(--danger-bg);color:var(--danger)}
.pill.liquidado{background:var(--success-bg);color:var(--success)}
.pill.apartada{background:var(--warn-bg);color:var(--warn)}
.ap-item{display:flex;gap:11px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.ap-item:last-child{border-bottom:none}
.ap-item-body{flex:1;min-width:0}
.ap-item-name{font-weight:600;font-size:13.5px;overflow-wrap:anywhere}
.ap-item-meta{font-size:11.5px;color:var(--text-muted);margin-top:2px}

.modal-backdrop{position:fixed;inset:0;background:rgba(20,15,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal-backdrop.top{z-index:30}
.modal-sheet{background:var(--surface);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0))}
.modal-handle{width:36px;height:4px;border-radius:999px;background:var(--border);margin:0 auto 14px}

.toast-root{position:fixed;top:14px;left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--toast-bg);color:var(--toast-fg);padding:10px 17px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:86%;text-align:center}
.gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;background:var(--bg)}

.btn-google:active{background:var(--surface-2)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .modal-sheet{animation:slideup .22s ease-out}

}
@keyframes slideup{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}

<script id="app-logic" type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc,
  query, orderBy, limit, getDocs, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

var firebaseConfig = {
  apiKey: "AIzaSyC-oYMHDhzc4xRbeJT8OOXB_JH3GK7owLI",
  authDomain: "mi-reventa.firebaseapp.com",
  projectId: "mi-reventa",
  storageBucket: "mi-reventa.firebasestorage.app",
  messagingSenderId: "495593028241",
  appId: "1:495593028241:web:f47c32b26fa2161fa7dd30"
};
var fbApp = initializeApp(firebaseConfig);
var auth = getAuth(fbApp);
var db = getFirestore(fbApp);
// Estructura: cada prenda, gasto, ingreso y proveedor es su propio documento.
// Asi ninguno se acerca al tope de 1 MB por documento y, al editar, solo viaja
// lo que cambio en vez del negocio entero.
var docRef = doc(db, 'negocio', 'datos');        // formato viejo, se conserva de respaldo
var configRef = doc(db, 'negocio', 'config');
var colProductos = collection(db, 'productos');
var colGastos = collection(db, 'gastos');
var colIngresos = collection(db, 'ingresos');   // ya no se usa: solo queda para limpiarla
var colProveedores = collection(db, 'proveedores');
var colApartados = collection(db, 'apartados');
var colCerradas = collection(db, 'cerradas');
var colSuscripciones = collection(db, 'suscripciones');
var histRef = collection(db, 'historial');
var colPapelera = collection(db, 'papelera');

var DIAS_APARTADO = 14;          // plazo para liquidar un apartado
// Clave publica VAPID: identifica a esta app ante el servicio de notificaciones.
// Es publica por diseno; la privada solo la tiene quien manda los avisos.
var VAPID_PUBLICA = 'BOAy2Mr7WoJA5LlQnqnD-zkZSsYG-ky3rYghVzN1bZDgNRqyHx6lfTGGDfWLxF7s_xcrMpUJ4o65kphhjAtTA0Y';
var AVISOS_ENVIO_LISTO = true;   // el envio diario corre en GitHub Actions
var MAX_VERSIONES = 20;
var MAX_PAPELERA = 30;
var LIMITE_DOC = 1048576;        // tope duro de Firestore por documento
var AVISO_TAMANO = 800000;       // avisar antes de chocar con el tope (por prenda)

// Construido sobre la version 1787976724-4d01 (estado publicado: sin prendas ni gastos),
// agregando inicio de sesion con Google y sincronizacion en Firestore para compartir
// el mismo inventario entre dos personas, en vez de guardar solo en este dispositivo.
(function(){
'use strict';

var CLAVE_RESPALDO = 'mi_reventa_ultimo_respaldo';

var CATEGORIAS = ['Publicidad', 'Transporte', 'Operarios', 'Empaque y envio', 'Alquiler', 'Otros'];

var state = { capitalInicial: 0, products: [], gastos: [], proveedores: [], apartados: [], cerradas: [] };
var tab = readTab();
var filter = 'todos';
var openId = null;
var askDelete = false;
var armedGasto = null;
var provOpen = false;
var armedProv = null;
var drafts = [];

var usuario = null;
var datosListos = false;
var gateEstado = 'cargando';
var unsubscribeDatos = null;

var histOpen = false;
var histCargando = false;
var histEntradas = [];
var armedHist = null;
var ultimoArchivado = 0;

var papOpen = false;
var papCargando = false;
var papEntradas = [];
var armedPap = null;

// Venta desde la pestana Vender: se eligen prendas, se ajustan en el formulario y
// se registran de una vez, como venta directa o como apartado.
var seleccion = [];
var ventaOpen = false;
var ventaItems = [];
var ventaValores = {};
var ventaForm = { fecha: '', apartado: false, cliente: '', abono: '' };

var CLAVE_DISPOSITIVO = 'mi_reventa_dispositivo';
var avisosEstado = 'revisando';
var abrirApartadosAlCargar = false;

var apOpen = false;
var apDetalle = null;
var apFiltro = 'activo';
var apAccion = null;
var ingresosLimpiados = false;

// Espejo de lo ultimo confirmado por el servidor. save() compara contra esto para
// escribir solo lo que cambio, y para saber que se borro.
var espejo = { config: null, productos: {}, gastos: {}, proveedores: {}, apartados: {}, cerradas: {} };
// datosListos solo se activa cuando las 5 fuentes cargaron: escribir con el estado
// a medias borraria lo que todavia no llego.
var fuentesCargadas = {};
var FUENTES = ['config', 'productos', 'gastos', 'proveedores', 'apartados', 'cerradas'];
var unsubs = [];
var migrando = false;

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function today(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }

function fechaMas(fechaISO, dias){
  var p = String(fechaISO).split('-');
  var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  if (isNaN(d.getTime())) d = new Date();
  d.setDate(d.getDate() + dias);
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}

// Dias que faltan para esa fecha: 0 es hoy, negativo ya paso.
function diasHasta(fechaISO){
  var p = String(fechaISO).split('-');
  var f = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  if (isNaN(f.getTime())) return 0;
  var h = new Date(); h.setHours(0, 0, 0, 0);
  return Math.round((f.getTime() - h.getTime()) / 86400000);
}

function fechaCorta(fechaISO){
  var p = String(fechaISO).split('-');
  if (p.length !== 3) return String(fechaISO);
  return Number(p[2]) + '/' + Number(p[1]);
}
function int(v, fallback){ var n = parseInt(v, 10); return (isNaN(n) || n < 0) ? fallback : n; }

// Migra formatos viejos: prendas sueltas (estado en_venta/vendido) a variantes+ventas,
// y agrega los campos nuevos (stockInicial, gastos) si el estado guardado no los tiene.
function migrate(raw){
  var s = (raw && typeof raw === 'object') ? raw : {};
  var out = {
    capitalInicial: num(s.capitalInicial),
    products: Array.isArray(s.products) ? s.products : [],
    gastos: Array.isArray(s.gastos) ? s.gastos : [],
    proveedores: Array.isArray(s.proveedores) ? s.proveedores : [],
    apartados: Array.isArray(s.apartados) ? s.apartados : [],
    cerradas: Array.isArray(s.cerradas) ? s.cerradas : []
  };
  out.proveedores = out.proveedores.map(function(v){
    return { id: v.id || uid('pr'), nombre: v.nombre || '', contacto: v.contacto || '' };
  });
  // Los textos libres de "donde la compre" que ya existan se convierten en proveedores,
  // uno por nombre distinto, para no perder de donde vino cada prenda.
  function proveedorPorNombre(nombre){
    var clave = nombre.trim().toLowerCase();
    for (var i = 0; i < out.proveedores.length; i++){
      if (out.proveedores[i].nombre.trim().toLowerCase() === clave) return out.proveedores[i];
    }
    var nuevo = { id: uid('pr'), nombre: nombre.trim(), contacto: '' };
    out.proveedores.push(nuevo);
    return nuevo;
  }
  out.products = out.products.map(function(p){
    var q = {
      id: p.id || uid('p'),
      nombre: p.nombre || '',
      proveedorId: p.proveedorId || null,
      dondeLoCompre: p.dondeLoCompre || '',
      costo: num(p.costo),
      precioVenta: num(p.precioVenta),
      stockInicial: p.stockInicial === true,
      fotos: Array.isArray(p.fotos) ? p.fotos : [],
      fechaCompra: p.fechaCompra || today(),
      variantes: Array.isArray(p.variantes) ? p.variantes : null,
      ventas: Array.isArray(p.ventas) ? p.ventas : null
    };
    if (!q.variantes){
      q.variantes = [{ id: uid('v'), talla: '', cantidad: 1 }];
    }
    if (!q.ventas){
      q.ventas = [];
      if (p.estado === 'vendido'){
        q.ventas.push({
          id: uid('s'),
          varianteId: q.variantes[0].id,
          cantidad: 1,
          precioUnitario: num(p.precioVentaFinal),
          fecha: p.fechaVenta || q.fechaCompra
        });
      }
    }
    q.variantes = q.variantes.map(function(v){
      return { id: v.id || uid('v'), talla: v.talla || '', cantidad: int(v.cantidad, 1) };
    });
    q.ventas = q.ventas.map(function(v){
      return {
        id: v.id || uid('s'),
        varianteId: v.varianteId || q.variantes[0].id,
        cantidad: int(v.cantidad, 1),
        precioUnitario: num(v.precioUnitario),
        fecha: v.fecha || q.fechaCompra,
        // Las ventas que salen de liquidar un apartado quedan atadas a el, para poder
        // deshacerlas juntas y no dejar el apartado marcado como cobrado sin sus ventas.
        apartadoId: v.apartadoId || null
      };
    });
    if (!q.proveedorId && q.dondeLoCompre.trim()){
      q.proveedorId = proveedorPorNombre(q.dondeLoCompre).id;
    }
    return q;
  });
  out.gastos = out.gastos.map(function(g){
    return {
      id: g.id || uid('g'),
      concepto: g.concepto || '',
      monto: num(g.monto),
      categoria: g.categoria || 'Otros',
      fecha: g.fecha || today()
    };
  });
  out.apartados = out.apartados.map(function(a){
    var fecha = a.fecha || today();
    return {
      id: a.id || uid('ap'),
      cliente: a.cliente || '',
      fecha: fecha,
      vence: a.vence || fechaMas(fecha, DIAS_APARTADO),
      estado: (a.estado === 'liquidado' || a.estado === 'vencido') ? a.estado : 'activo',
      liquidadoEn: a.liquidadoEn || '',
      items: (Array.isArray(a.items) ? a.items : []).map(function(it){
        return {
          productoId: it.productoId || '',
          varianteId: it.varianteId || '',
          nombre: it.nombre || '',
          talla: it.talla || '',
          cantidad: int(it.cantidad, 1),
          precioUnitario: num(it.precioUnitario)
        };
      }),
      abonos: (Array.isArray(a.abonos) ? a.abonos : []).map(function(ab){
        return { id: ab.id || uid('ab'), monto: num(ab.monto), fecha: ab.fecha || fecha };
      })
    };
  });
  out.cerradas = out.cerradas.map(function(c){
    return {
      id: c.id || uid('c'),
      nombre: c.nombre || '',
      fecha: c.fecha || today(),
      costoPagado: num(c.costoPagado),
      cobrado: num(c.cobrado),
      ganancia: num(c.ganancia),
      unidadesVendidas: int(c.unidadesVendidas, 0),
      borradoPor: c.borradoPor || ''
    };
  });
  return out;
}

function diasDesdeRespaldo(){
  try{
    var t = localStorage.getItem(CLAVE_RESPALDO);
    if (!t) return null;
    return Math.floor((Date.now() - Number(t)) / 86400000);
  }catch(e){ return null; }
}

function hayDatos(){
  return state.products.length || state.gastos.length || state.apartados.length;
}

function proveedor(id){
  for (var i = 0; i < state.proveedores.length; i++){
    if (state.proveedores[i].id === id) return state.proveedores[i];
  }
  return null;
}

// El nombre del proveedor sale de la lista; si la prenda quedo sin vincular
// (proveedor borrado, o dato viejo) se usa el texto guardado en la prenda.
function nombreProveedor(p){
  var pr = p.proveedorId ? proveedor(p.proveedorId) : null;
  return pr ? pr.nombre : (p.dondeLoCompre || '');
}

function proveedorSelectHTML(id, seleccionado){
  var opts = '<option value="">Sin proveedor</option>';
  opts += state.proveedores.map(function(v){
    return '<option value="' + esc(v.id) + '"' + (v.id === seleccionado ? ' selected' : '') + '>' + esc(v.nombre) + '</option>';
  }).join('');
  opts += '<option value="__nuevo__">+ Proveedor nuevo...</option>';
  return '<div class="field"><label for="' + id + '">Proveedor</label>'
    + '<select id="' + id + '" data-nuevo="' + id + '-nuevo">' + opts + '</select>'
    + '<input id="' + id + '-nuevo" type="text" placeholder="Nombre del proveedor nuevo" hidden style="margin-top:8px">'
    + '</div>'
    + '<div class="linkrow"><button type="button" class="linkbtn" data-act="open-prov">Gestionar proveedores</button></div>';
}

// Lee el proveedor elegido en un select; si se eligio "nuevo" y hay nombre, lo crea.
function resolverProveedor(id){
  var sel = document.getElementById(id);
  if (!sel) return null;
  if (sel.value !== '__nuevo__') return sel.value || null;
  var campo = document.getElementById(id + '-nuevo');
  var nombre = campo ? campo.value.trim() : '';
  if (!nombre) return null;
  for (var i = 0; i < state.proveedores.length; i++){
    if (state.proveedores[i].nombre.trim().toLowerCase() === nombre.toLowerCase()) return state.proveedores[i].id;
  }
  var nuevo = { id: uid('pr'), nombre: nombre, contacto: '' };
  state.proveedores.push(nuevo);
  return nuevo.id;
}

function comprasDe(provId){
  var r = { prendas: 0, unidades: 0, gastado: 0 };
  state.products.forEach(function(p){
    if (p.proveedorId !== provId) return;
    r.prendas++;
    r.unidades += compradas(p);
    r.gastado += p.costo * compradas(p);
  });
  return r;
}

function readTab(){
  try{ return sessionStorage.getItem('mr_tab') || 'inventario'; }catch(e){ return 'inventario'; }
}

function rememberTab(){
  try{ sessionStorage.setItem('mr_tab', tab); }catch(e){}
}

function money(v){
  var n = Math.round(num(v) * 100) / 100;
  var sign = n < 0 ? '-' : '';
  var p = Math.abs(n).toFixed(2).split('.');
  return sign + '$' + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
}

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ---------- cantidades derivadas ----------
function compradas(p){
  return p.variantes.reduce(function(a, v){ return a + v.cantidad; }, 0);
}
function vendidas(p){
  return p.ventas.reduce(function(a, s){ return a + s.cantidad; }, 0);
}
// Sin vender = lo que todavia es tuyo, apartado incluido (el apartado no es venta).
// Disponible = lo que puedes ofrecerle a alguien mas hoy.
function sinVender(p){
  return Math.max(0, compradas(p) - vendidas(p));
}
function disponibles(p){
  return Math.max(0, compradas(p) - vendidas(p) - apartadas(p));
}
function vendidasDe(p, varianteId){
  return p.ventas.reduce(function(a, s){ return s.varianteId === varianteId ? a + s.cantidad : a; }, 0);
}
function comprometidasDe(p, varianteId){
  return vendidasDe(p, varianteId) + apartadasDe(p, varianteId);
}
function stockDe(p, v){
  return Math.max(0, v.cantidad - comprometidasDe(p, v.id));
}
function cobradoDe(p){
  return p.ventas.reduce(function(a, s){ return a + s.precioUnitario * s.cantidad; }, 0);
}
function gananciaDe(p){
  return p.ventas.reduce(function(a, s){ return a + (s.precioUnitario - p.costo) * s.cantidad; }, 0);
}
// ---------- apartados ----------
function apartado(id){
  for (var i = 0; i < state.apartados.length; i++){
    if (state.apartados[i].id === id) return state.apartados[i];
  }
  return null;
}
function totalApartado(a){
  return a.items.reduce(function(x, it){ return x + it.precioUnitario * it.cantidad; }, 0);
}
function abonadoDe(a){
  return a.abonos.reduce(function(x, ab){ return x + ab.monto; }, 0);
}
function restanteDe(a){
  return Math.max(0, totalApartado(a) - abonadoDe(a));
}
function unidadesDe(a){
  return a.items.reduce(function(x, it){ return x + it.cantidad; }, 0);
}
// El vencimiento se deduce de la fecha, no de un campo que alguien tenga que actualizar:
// asi los dos telefonos ven lo mismo aunque nadie abra la app el dia del plazo.
function estadoApartado(a){
  if (a.estado === 'liquidado' || a.estado === 'vencido') return a.estado;
  return diasHasta(a.vence) < 0 ? 'vencido' : 'activo';
}
function etiquetaEstado(est){
  return est === 'activo' ? 'Activo' : est === 'vencido' ? 'Vencido' : 'Liquidado';
}
// Unidades reservadas en apartados vigentes. Las de uno vencido ya no cuentan:
// volvieron al inventario. Las de uno liquidado tampoco: son ventas.
function apartadasDe(p, varianteId){
  var t = 0;
  state.apartados.forEach(function(a){
    if (estadoApartado(a) !== 'activo') return;
    a.items.forEach(function(it){
      if (it.productoId === p.id && it.varianteId === varianteId) t += it.cantidad;
    });
  });
  return t;
}
function apartadas(p){
  var t = 0;
  state.apartados.forEach(function(a){
    if (estadoApartado(a) !== 'activo') return;
    a.items.forEach(function(it){ if (it.productoId === p.id) t += it.cantidad; });
  });
  return t;
}

// Deja asentado el paso de una prenda por la caja antes de sacarla del inventario.
// Sin esto, borrar una prenda vendida borraria tambien el dinero que dejo, y borrar
// una comprada le devolveria a la caja un dinero que en realidad ya se gasto.
function cerrarPrenda(p){
  var costoTotal = p.costo * compradas(p);
  state.cerradas.unshift({
    id: p.id,
    nombre: p.nombre,
    fecha: today(),
    costoPagado: p.stockInicial ? 0 : costoTotal,
    cobrado: cobradoDe(p),
    ganancia: gananciaDe(p),
    unidadesVendidas: vendidas(p),
    borradoPor: usuario ? usuario.email : ''
  });
}

function etiquetaVariante(p, varianteId){
  for (var i = 0; i < p.variantes.length; i++){
    if (p.variantes[i].id === varianteId) return p.variantes[i].talla || 'sin talla';
  }
  return 'sin talla';
}

// Dinero del negocio = capital inicial - compras nuevas - gastos + cobrado en ventas
// + todo lo abonado en apartados (ese dinero ya esta en la mano, se liquide o no).
// La ropa marcada como stock inicial ya estaba pagada antes de empezar: no toca la caja.
function totals(){
  var t = {
    caja: 0, comprasNuevas: 0, valorStockInicial: 0, cobrado: 0,
    gastos: 0, gananciaBruta: 0, gananciaNeta: 0,
    invertidoEnStock: 0, unidadesStock: 0, unidadesVendidas: 0, unidadesApartadas: 0,
    prendasIniciales: 0, prendasCerradas: 0, cobradoCerrado: 0,
    apActivos: 0, apAbonado: 0, apPorCobrar: 0, apValor: 0,
    apVencidos: 0, apPerdidos: 0, apPorVencer: 0, apLiquidados: 0
  };
  state.products.forEach(function(p){
    var costoTotal = p.costo * compradas(p);
    if (p.stockInicial){
      t.valorStockInicial += costoTotal;
      t.prendasIniciales++;
    } else {
      t.comprasNuevas += costoTotal;
    }
    t.cobrado += cobradoDe(p);
    t.gananciaBruta += gananciaDe(p);
    t.invertidoEnStock += p.costo * sinVender(p);
    t.unidadesStock += disponibles(p);
    t.unidadesApartadas += apartadas(p);
    t.unidadesVendidas += vendidas(p);
  });
  // Prendas ya borradas: lo que gastaste comprandolas y lo que cobraste vendiendolas
  // sigue contando. Lo unico que deja de contar es el stock, que efectivamente ya no
  // tienes. Sacar algo del inventario no rescribe el dinero que ya se movio.
  state.cerradas.forEach(function(c){
    t.comprasNuevas += c.costoPagado;
    t.cobrado += c.cobrado;
    t.gananciaBruta += c.ganancia;
    t.unidadesVendidas += c.unidadesVendidas;
    t.cobradoCerrado += c.cobrado;
    t.prendasCerradas++;
  });
  t.gastos = state.gastos.reduce(function(a, g){ return a + g.monto; }, 0);
  state.apartados.forEach(function(a){
    var est = estadoApartado(a);
    if (est === 'liquidado'){ t.apLiquidados++; return; }   // ya cuenta como venta cobrada
    var ab = abonadoDe(a);
    if (est === 'vencido'){
      t.apVencidos++;
      t.apPerdidos += ab;
      return;
    }
    t.apActivos++;
    t.apAbonado += ab;
    t.apPorCobrar += restanteDe(a);
    t.apValor += totalApartado(a);
    if (diasHasta(a.vence) <= 3) t.apPorVencer++;
  });
  t.caja = state.capitalInicial - t.comprasNuevas - t.gastos + t.cobrado + t.apAbonado + t.apPerdidos;
  // Lo abonado en un apartado vencido es ganancia limpia: la prenda volvio al inventario
  // y el dinero se queda. Lo abonado en uno vigente todavia no es ganancia: la venta
  // no esta cerrada y la prenda sigue siendo tuya.
  t.gananciaNeta = t.gananciaBruta + t.apPerdidos - t.gastos;
  return t;
}

// Guarda el negocio entero como un solo documento en Firestore, compartido entre
// las cuentas autorizadas. No escribe nada hasta que llego el primer snapshot real
// (datosListos), para no pisar los datos de la otra persona con el estado vacio
// de arranque mientras se conecta.
function manejarErrorEscritura(err){
  if (err && err.code === 'permission-denied'){
    gateEstado = 'sin-acceso';
    renderGate();
    return;
  }
  toast('No se pudo guardar. Revisa tu conexion.');
}

// Escribe solo las entidades que cambiaron desde la ultima confirmacion del servidor,
// y borra las que desaparecieron. Evita reenviar el negocio completo en cada edicion.
function sincronizarColeccion(lista, col, espejoCol){
  var vistos = {};
  lista.forEach(function(item){
    vistos[item.id] = true;
    var serial = JSON.stringify(item);
    if (espejoCol[item.id] === serial) return;
    if (serial.length > LIMITE_DOC){
      toast('"' + (item.nombre || item.concepto || 'Un registro') + '" pesa mas de 1 MB. Quitale alguna foto.');
      return;
    }
    espejoCol[item.id] = serial;
    setDoc(doc(col, item.id), item).catch(function(err){
      delete espejoCol[item.id];
      manejarErrorEscritura(err);
    });
  });
  Object.keys(espejoCol).forEach(function(id){
    if (vistos[id]) return;
    delete espejoCol[id];
    deleteDoc(doc(col, id)).catch(manejarErrorEscritura);
  });
}

function save(){
  rememberTab();
  if (!datosListos || !usuario || migrando) return;

  var conf = JSON.stringify({ capitalInicial: state.capitalInicial });
  if (espejo.config !== conf){
    espejo.config = conf;
    setDoc(configRef, { capitalInicial: state.capitalInicial }).catch(function(err){
      espejo.config = null;
      manejarErrorEscritura(err);
    });
  }

  sincronizarColeccion(state.products, colProductos, espejo.productos);
  sincronizarColeccion(state.gastos, colGastos, espejo.gastos);
  sincronizarColeccion(state.proveedores, colProveedores, espejo.proveedores);
  sincronizarColeccion(state.apartados, colApartados, espejo.apartados);
  sincronizarColeccion(state.cerradas, colCerradas, espejo.cerradas);

  archivarVersion();
}

// Copia para volver atras. Se guarda SIN fotos: son el 99% del peso, casi nunca es
// lo que hace falta recuperar, y con ellas cada copia chocaria contra el tope de 1 MB.
// Al restaurar, las fotos de las prendas que sigan existiendo se conservan.
function estadoSinFotos(){
  var copia = JSON.parse(JSON.stringify(state));
  copia.products.forEach(function(p){ p.fotos = []; });
  return copia;
}

// Se limita a una version por minuto para no duplicar trafico al editar seguido,
// y solo conserva las ultimas MAX_VERSIONES.
function archivarVersion(){
  var ahora = Date.now();
  if (ahora - ultimoArchivado < 60000) return;
  ultimoArchivado = ahora;

  var serial = JSON.stringify(estadoSinFotos());
  if (serial.length > LIMITE_DOC){ ultimoArchivado = 0; return; }

  addDoc(histRef, {
    datos: serial,
    fecha: new Date().toISOString(),
    autor: usuario ? usuario.email : '',
    prendas: state.products.length
  }).then(podarHistorial).catch(function(){
    // Que falle el historial nunca debe romper el guardado principal.
    ultimoArchivado = 0;
  });
}

function podarHistorial(){
  getDocs(query(histRef, orderBy('fecha', 'desc'))).then(function(snap){
    var docs = snap.docs;
    for (var i = MAX_VERSIONES; i < docs.length; i++){
      deleteDoc(docs[i].ref).catch(function(){});
    }
  }).catch(function(){});
}

// Al borrar una prenda se guarda entera (fotos incluidas) en la papelera, para poder
// devolverla tal cual. Solo se conservan las ultimas MAX_PAPELERA.
function mandarAPapelera(p){
  var copia = JSON.parse(JSON.stringify(p));
  copia.borradoEn = new Date().toISOString();
  copia.borradoPor = usuario ? usuario.email : '';
  return setDoc(doc(colPapelera, p.id), copia).then(podarPapelera).catch(function(){});
}

function podarPapelera(){
  return getDocs(query(colPapelera, orderBy('borradoEn', 'desc'))).then(function(snap){
    var docs = snap.docs;
    for (var i = MAX_PAPELERA; i < docs.length; i++){
      deleteDoc(docs[i].ref).catch(function(){});
    }
  }).catch(function(){});
}

function cargarPapelera(){
  papCargando = true;
  renderPapelera();
  getDocs(query(colPapelera, orderBy('borradoEn', 'desc'), limit(MAX_PAPELERA))).then(function(snap){
    papEntradas = snap.docs.map(function(d){
      var v = d.data();
      v.id = d.id;
      return v;
    });
    papCargando = false;
    renderPapelera();
  }).catch(function(){
    papCargando = false;
    papEntradas = [];
    renderPapelera();
    toast('No se pudo cargar la papelera.');
  });
}

function cargarHistorial(){
  histCargando = true;
  renderHistorial();
  getDocs(query(histRef, orderBy('fecha', 'desc'), limit(MAX_VERSIONES))).then(function(snap){
    histEntradas = snap.docs.map(function(d){
      var v = d.data();
      return { id: d.id, fecha: v.fecha || '', autor: v.autor || '', prendas: v.prendas, datos: v.datos };
    });

    renderHistorial();
  }).catch(function(){
    histCargando = false;
    histEntradas = [];
    renderHistorial();
    toast('No se pudo cargar el historial.');
  });
}

function fechaLegible(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  var mins = Math.floor((Date.now() - d.getTime()) / 60000);
  var rel;
  if (mins < 1) rel = 'recien';
  else if (mins < 60) rel = 'hace ' + mins + ' min';
  else if (mins < 1440) rel = 'hace ' + Math.floor(mins/60) + ' h';
  else rel = 'hace ' + Math.floor(mins/1440) + ' d';
  return d.getDate() + '/' + (d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' (' + rel + ')';
}

function errorDeDatos(err){
  datosListos = false;
  gateEstado = (err && err.code === 'permission-denied') ? 'sin-acceso' : 'error-datos';
  renderGate();
}

function marcarCargada(nombre){
  fuentesCargadas[nombre] = true;
  if (datosListos) return true;
  var faltan = FUENTES.some(function(f){ return !fuentesCargadas[f]; });
  if (faltan) return false;
  datosListos = true;
  gateEstado = null;
  renderGate();
  migrarSiHaceFalta();
  limpiarIngresosViejos();
  revisarAvisos();
  // Si se llego tocando una notificacion, se abre directo en apartados.
  if (abrirApartadosAlCargar){
    abrirApartadosAlCargar = false;
    tab = 'resumen';
    apOpen = true; apDetalle = null; apAccion = null; apFiltro = 'activo';
  }
  return true;
}

function refrescar(){
  // En la pestana Agregar no se reconstruye el formulario ante un cambio remoto,
  // para no borrar lo que la persona esta escribiendo en ese momento.
  if (tab === 'agregar') renderTopbar();
  else render();
}

// Cada coleccion se refleja en su parte del estado. El eco de nuestra propia
// escritura (hasPendingWrites) ya esta en pantalla, asi que no se reaplica.
function suscribirColeccion(col, nombre, campo, normalizar){
  return onSnapshot(col, function(snap){
    if (!snap.metadata.hasPendingWrites || !datosListos){
      var items = snap.docs.map(function(d){
        var v = d.data();
        v.id = d.id;
        return v;
      });
      espejo[nombre] = {};
      items.forEach(function(it){ espejo[nombre][it.id] = JSON.stringify(it); });
      state[campo] = normalizar ? normalizar(items) : items;
      state = migrate(state);
      // migrate() puede rellenar campos: el espejo debe reflejar lo que hay en el servidor,
      // no lo normalizado, para no disparar escrituras infinitas.
    }
    if (marcarCargada(nombre)) refrescar();
  }, errorDeDatos);
}

function suscribirDatos(){
  fuentesCargadas = {};
  datosListos = false;
  unsubs.forEach(function(u){ try{ u(); }catch(e){} });
  unsubs = [];

  unsubs.push(onSnapshot(configRef, function(snap){
    if (!snap.metadata.hasPendingWrites || !datosListos){
      var v = snap.exists() ? snap.data() : {};
      state.capitalInicial = num(v.capitalInicial);
      espejo.config = JSON.stringify({ capitalInicial: state.capitalInicial });
    }
    if (marcarCargada('config')) refrescar();
  }, errorDeDatos));

  unsubs.push(suscribirColeccion(colProductos, 'productos', 'products'));
  unsubs.push(suscribirColeccion(colGastos, 'gastos', 'gastos'));
  unsubs.push(suscribirColeccion(colProveedores, 'proveedores', 'proveedores'));
  unsubs.push(suscribirColeccion(colApartados, 'apartados', 'apartados'));
  unsubs.push(suscribirColeccion(colCerradas, 'cerradas', 'cerradas'));

  unsubscribeDatos = function(){
    unsubs.forEach(function(u){ try{ u(); }catch(e){} });
    unsubs = [];
  };
}

// Pasa el formato viejo (todo el negocio en negocio/datos) al nuevo (un documento por
// entidad). Solo corre si el formato nuevo esta vacio, asi que es seguro repetirla.
// El documento viejo NO se borra: queda como respaldo.
// Los ingresos sueltos se quitaron del negocio: el dinero solo entra vendiendo o
// cobrando apartados. Se borran los que quedaron de la version anterior.
function limpiarIngresosViejos(){
  if (ingresosLimpiados) return;
  ingresosLimpiados = true;
  getDocs(colIngresos).then(function(snap){
    snap.docs.forEach(function(d){ deleteDoc(d.ref).catch(function(){}); });
  }).catch(function(){});
}

function migrarSiHaceFalta(){
  var vacio = !state.products.length && !state.gastos.length
    && !state.proveedores.length && !state.apartados.length && !state.cerradas.length;
  if (!vacio) return;

  getDoc(docRef).then(function(snap){
    if (!snap.exists()) return;
    var viejo = migrate(snap.data());
    var total = viejo.products.length + viejo.gastos.length + viejo.proveedores.length;
    if (!total) return;

    migrando = true;
    gateEstado = 'migrando';
    renderGate();

    var tareas = [];
    viejo.products.forEach(function(p){ tareas.push(setDoc(doc(colProductos, p.id), p)); });
    viejo.gastos.forEach(function(g){ tareas.push(setDoc(doc(colGastos, g.id), g)); });
    viejo.proveedores.forEach(function(v){ tareas.push(setDoc(doc(colProveedores, v.id), v)); });
    tareas.push(setDoc(configRef, { capitalInicial: viejo.capitalInicial }));

    Promise.all(tareas).then(function(){
      migrando = false;
      gateEstado = null;
      renderGate();
      toast('Datos migrados al formato nuevo: ' + viejo.products.length + ' prenda' + (viejo.products.length === 1 ? '' : 's') + '.');
    }, function(err){
      migrando = false;
      gateEstado = null;
      renderGate();
      manejarErrorEscritura(err);
      toast('La migracion no se completo. Tus datos viejos siguen intactos.');
    });
  }).catch(function(){});
}

// ---------- avisos en el telefono ----------
// Apple solo permite notificaciones web si la app se abrio desde el icono de la
// pantalla de inicio. En una pestana normal de Safari ni siquiera existe la API.
function esStandalone(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }catch(e){ return navigator.standalone === true; }
}

function esIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}

function soportaAvisos(){
  return 'serviceWorker' in navigator && 'PushManager' in window && typeof Notification !== 'undefined';
}

// Un id propio por telefono, para que reactivar no deje suscripciones duplicadas.
function idDispositivo(){
  try{
    var v = localStorage.getItem(CLAVE_DISPOSITIVO);
    if (!v){ v = uid('d'); localStorage.setItem(CLAVE_DISPOSITIVO, v); }
    return v;
  }catch(e){ return 'sin-almacenamiento'; }
}

function claveVapid(base64){
  var relleno = '='.repeat((4 - base64.length % 4) % 4);
  var limpio = (base64 + relleno).replace(/-/g, '+').replace(/_/g, '/');
  var crudo = atob(limpio);
  var salida = new Uint8Array(crudo.length);
  for (var i = 0; i < crudo.length; i++) salida[i] = crudo.charCodeAt(i);
  return salida;
}

function guardarSuscripcion(sub){
  if (!usuario || !sub) return Promise.resolve();
  var datos;
  try{ datos = JSON.parse(JSON.stringify(sub)); }catch(e){ return Promise.resolve(); }
  return setDoc(doc(colSuscripciones, idDispositivo()), {
    endpoint: datos.endpoint || '',
    p256dh: (datos.keys && datos.keys.p256dh) || '',
    auth: (datos.keys && datos.keys.auth) || '',
    email: usuario.email,
    navegador: String(navigator.userAgent).slice(0, 180),
    actualizado: new Date().toISOString()
  });
}

// Al abrir la app se revisa en que estado quedo este telefono, y de paso se
// refresca la suscripcion guardada: el navegador puede cambiarle el endpoint.
function revisarAvisos(){
  if (esIOS() && !esStandalone()){ avisosEstado = 'instalar'; refrescar(); return; }
  if (!soportaAvisos()){ avisosEstado = 'no-soporta'; refrescar(); return; }
  if (Notification.permission === 'denied'){ avisosEstado = 'bloqueado'; refrescar(); return; }

  navigator.serviceWorker.register('sw.js').then(function(reg){
    return reg.pushManager.getSubscription();
  }).then(function(sub){
    avisosEstado = sub ? 'activo' : 'inactivo';
    refrescar();
    if (sub) return guardarSuscripcion(sub);
  }).catch(function(){
    avisosEstado = 'inactivo';
    refrescar();
  });
}

function activarAvisos(){
  if (avisosEstado === 'trabajando') return;
  // El permiso tiene que pedirse dentro del toque, sin esperar nada antes:
  // si se hace despues de un await, iOS lo descarta.
  var pedido;
  try{
    pedido = Notification.requestPermission();
  }catch(e){
    toast('Este navegador no deja pedir permiso de notificaciones.');
    return;
  }
  if (!pedido || typeof pedido.then !== 'function'){
    pedido = new Promise(function(res){ setTimeout(function(){ res(Notification.permission); }, 400); });
  }

  avisosEstado = 'trabajando';
  render();

  pedido.then(function(permiso){
    if (permiso !== 'granted'){
      avisosEstado = (permiso === 'denied') ? 'bloqueado' : 'inactivo';
      render();
      toast('No se activaron los avisos.');
      return null;
    }
    return navigator.serviceWorker.register('sw.js')
      .then(function(){ return navigator.serviceWorker.ready; })
      .then(function(reg){
        return reg.pushManager.getSubscription().then(function(previa){
          if (previa) return previa;
          return reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: claveVapid(VAPID_PUBLICA)
          });
        });
      })
      .then(function(sub){ return guardarSuscripcion(sub); })
      .then(function(){
        avisosEstado = 'activo';
        render();
        toast('Avisos activados en este telefono.');
      });
  }).catch(function(err){
    avisosEstado = 'inactivo';
    render();
    toast('No se pudieron activar los avisos' + (err && err.name ? ' (' + err.name + ')' : '') + '.');
  });
}

function desactivarAvisos(){
  avisosEstado = 'trabajando';
  render();
  navigator.serviceWorker.getRegistration().then(function(reg){
    return reg ? reg.pushManager.getSubscription() : null;
  }).then(function(sub){
    return sub ? sub.unsubscribe() : true;
  }).then(function(){
    return deleteDoc(doc(colSuscripciones, idDispositivo())).catch(function(){});
  }).then(function(){
    avisosEstado = 'inactivo';
    render();
    toast('Avisos apagados en este telefono.');
  }).catch(function(){
    avisosEstado = 'activo';
    render();
    toast('No se pudieron apagar los avisos.');
  });
}

// Muestra una notificacion generada en el propio telefono. Sirve para comprobar

function avisoDePrueba(){

      badge: 'icono.png',

    });

function bloqueAvisos(){
  if (avisosEstado === 'revisando'){
    return '<div class="hint">Revisando...</div>';
  }
  if (avisosEstado === 'instalar'){
    return '<div class="hint">Para recibir avisos hay que abrir Mi Reventa desde el icono de la pantalla de inicio. '
      + 'Si todavia no lo tienes: en Safari toca Compartir y luego "Agregar a inicio". '
      + 'Apple no permite notificaciones desde una pestana normal.</div>';
  }
  if (avisosEstado === 'no-soporta'){
    return '<div class="hint">Este navegador no permite notificaciones.</div>';
  }
  if (avisosEstado === 'bloqueado'){
    return '<div class="hint">Las notificaciones estan bloqueadas para esta app. '
      + 'Se vuelven a permitir en Ajustes del telefono, en Mi Reventa, Notificaciones.</div>';
  }
  if (avisosEstado === 'trabajando'){
    return '<div style="display:flex;align-items:center;gap:10px"><div class="spinner"></div>'
      + '<span class="hint">Un momento...</span></div>';
  }
  if (avisosEstado === 'activo'){
    return '<div class="hint" style="margin-bottom:10px">Este telefono quedo registrado para los avisos de apartados. '
      + 'Cada telefono se activa por separado, asi que Vanessa tiene que hacerlo en el suyo.'
      + (AVISOS_ENVIO_LISTO ? '' : ' Falta conectar el envio diario; mientras tanto puedes ver como se veria.')
      + '</div>'
      + '<button class="btn secondary" data-act="aviso-prueba">Mandar una de prueba</button>'
      + '<button class="btn secondary" style="margin-top:10px" data-act="avisos-off">Apagar avisos en este telefono</button>';
  }
  return '<div class="hint" style="margin-bottom:10px">Un aviso en el telefono cuando un apartado este por vencer, '
    + 'aunque no tengas la app abierta.</div>'
    + '<button class="btn" data-act="avisos-on">Activar notificaciones</button>';
}

function descargarRespaldo(){
  var datos = JSON.stringify(state, null, 2);
  var blob = new Blob([datos], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'mi-reventa-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  try{ localStorage.setItem(CLAVE_RESPALDO, String(Date.now())); }catch(e){}
  render();
  toast('Respaldo descargado. Guardalo en Archivos o iCloud.');
}

function restaurarRespaldo(file){
  var reader = new FileReader();
  reader.onerror = function(){ toast('No se pudo leer el archivo.'); };
  reader.onload = function(){
    var datos;
    try{
      datos = JSON.parse(reader.result);
    }catch(e){
      toast('Ese archivo no es un respaldo valido.');
      return;
    }
    if (!datos || !Array.isArray(datos.products)){
      toast('Ese archivo no tiene el formato de un respaldo.');
      return;
    }
    state = migrate(datos);
    openId = null; provOpen = false; armedGasto = null; armedProv = null;
    render(); save();
    toast('Respaldo restaurado: ' + state.products.length + ' prenda' + (state.products.length === 1 ? '' : 's') + '.');
  };
  reader.readAsText(file);
}

function toast(msg){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3400);
}

function shrink(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('decode')); };
      img.onload = function(){
        var scale = Math.min(1, 620 / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function viewResumen(){

  var abonos = t.apAbonado + t.apPerdidos;
  var max = Math.max(t.comprasNuevas, t.cobrado, t.gastos, abonos, 1);

// Cada prenda es su propio documento y Firestore admite 1 MB por documento, asi que
// el limite aplica por prenda (por sus fotos), no al negocio entero.
function avisoTamano(){
  var peor = null, peorBytes = 0;
  try{
    state.products.forEach(function(p){
      var b = JSON.stringify(p).length;
      if (b > peorBytes){ peorBytes = b; peor = p; }
    });
  }catch(e){ return ''; }
  if (peorBytes < AVISO_TAMANO) return '';
  var pct = Math.round(peorBytes / LIMITE_DOC * 100);
  return '<div class="check-row" style="cursor:default;margin-top:14px"><span style="font-size:19px">&#9888;</span>'
    + '<span><span class="ct">"' + esc(peor.nombre) + '" ocupa el ' + pct + '% del limite</span>'
    + '<span class="cs">Firestore permite 1 MB por prenda y las fotos son lo que mas pesa. Quitale alguna foto para poder seguir editandola.</span></span></div>';
}

function avisoRespaldo(){
  if (!hayDatos()) return '';
  var dias = diasDesdeRespaldo();
  if (dias === null){
    return '<div class="hint" style="margin-bottom:10px">Todavia no descargaste ningun respaldo desde este dispositivo.</div>';
  }
  return '<div class="hint" style="margin-bottom:10px">Ultimo respaldo desde este dispositivo: '
    + (dias === 0 ? 'hoy' : 'hace ' + dias + ' dia' + (dias === 1 ? '' : 's')) + '.</div>';
}

// ---------- venta / apartado ----------
// Los valores tipeados se leen del DOM mientras el formulario existe; si todavia no
// se dibujo (primer render) se usan los guardados o el precio de lista de la prenda.
function leerFilasVenta(){
  var filas = document.querySelectorAll('#venta-root .vi-row');
  if (!filas.length) return null;
  var out = [];
  for (var i = 0; i < filas.length; i++){
    out.push({
      productoId: filas[i].getAttribute('data-pid'),
      varianteId: filas[i].querySelector('.vi-talla').value,
      cantidad: int(filas[i].querySelector('.vi-cant').value, 1),
      precioUnitario: num(filas[i].querySelector('.vi-precio').value)
    });
  }
  return out;
}

function itemsVenta(){
  var dom = leerFilasVenta();
  if (dom) return dom;
  var out = [];
  ventaItems.forEach(function(pid){
    var p = find(pid);
    if (!p) return;
    var conStock = p.variantes.filter(function(x){ return stockDe(p, x) > 0; });
    if (!conStock.length) return;
    var v = ventaValores[pid] || {};
    out.push({
      productoId: pid,
      varianteId: v.vid || conStock[0].id,
      cantidad: v.cant || 1,
      precioUnitario: (v.precio != null) ? v.precio : p.precioVenta
    });
  });
  return out;
}

function cosecharVenta(){
  var filas = document.querySelectorAll('#venta-root .vi-row');
  for (var i = 0; i < filas.length; i++){
    ventaValores[filas[i].getAttribute('data-pid')] = {
      vid: filas[i].querySelector('.vi-talla').value,
      cant: int(filas[i].querySelector('.vi-cant').value, 1),
      precio: num(filas[i].querySelector('.vi-precio').value)
    };
  }
  var f = document.getElementById('v-fecha');
  if (f) ventaForm.fecha = f.value || today();
  var c = document.getElementById('v-cliente');
  if (c) ventaForm.cliente = c.value;
  var ab = document.getElementById('v-abono');
  if (ab) ventaForm.abono = ab.value;
  var chk = document.getElementById('v-apartado');
  if (chk) ventaForm.apartado = chk.checked;
}

function totalesVentaHTML(){
  var items = itemsVenta();
  var total = items.reduce(function(a, it){ return a + it.precioUnitario * it.cantidad; }, 0);
  var uds = items.reduce(function(a, it){ return a + it.cantidad; }, 0);
  var html = '<div class="tot-row"><span>Unidades</span><b>' + uds + '</b></div>';
  if (ventaForm.apartado){
    var campo = document.getElementById('v-abono');
    var abono = num(campo ? campo.value : ventaForm.abono);
    if (abono < 0) abono = 0;
    if (abono > total) abono = total;
    html += '<div class="tot-row"><span>Total</span><b>' + money(total) + '</b></div>'
      + '<div class="tot-row"><span>Abona ahora</span><b>' + money(abono) + '</b></div>'
      + '<div class="tot-row big debe"><span>Queda debiendo</span><b>' + money(total - abono) + '</b></div>';
  } else {
    html += '<div class="tot-row big"><span>Total a cobrar</span><b>' + money(total) + '</b></div>';
  }
  return html;
}

  root.innerHTML = '';

    var conStock = p.variantes.filter(function(x){ return stockDe(p, x) > 0; });

    var v = ventaValores[pid] || {};

    var foto = p.fotos.length

// ---------- apartados ----------
function confirmApHTML(texto, act, etiqueta, clase){
  return '<div class="confirm-box"><div class="confirm-text">' + texto + '</div>'
    + '<div class="confirm-actions"><button class="btn secondary" data-act="ap-cancel">Cancelar</button>'
    + '<button class="btn ' + clase + '" data-act="' + act + '">' + etiqueta + '</button></div></div>';
}

function tarjetaApartadoHTML(a){
  var est = estadoApartado(a);
  var dias = diasHasta(a.vence);
  var resto = restanteDe(a);
  var urge = est === 'activo' && dias <= 3;
  var pie;
  if (est === 'activo'){
    pie = (dias === 0 ? 'Vence hoy' : dias === 1 ? 'Vence manana' : 'Vence en ' + dias + ' dias')
      + ' &middot; ' + fechaCorta(a.vence);
  } else if (est === 'vencido'){
    pie = 'Vencio el ' + fechaCorta(a.vence) + ' &middot; las prendas volvieron al inventario';
  } else {
    pie = 'Liquidado el ' + fechaCorta(a.liquidadoEn || a.fecha);
  }
  return '<button class="ap-card" data-act="ap-open" data-value="' + esc(a.id) + '">'
    + '<div class="ap-top"><span class="ap-cliente">' + esc(a.cliente || 'Sin nombre') + '</span>'
    + '<span class="pill ' + (urge ? 'pronto' : est) + '">' + (urge ? 'Por vencer' : etiquetaEstado(est)) + '</span></div>'
    + '<div class="ap-nums">'
    + '<div class="ap-num"><b>Prendas</b><span>' + unidadesDe(a) + '</span></div>'
    + '<div class="ap-num"><b>Abonado</b><span>' + money(abonadoDe(a)) + '</span></div>'
    + '<div class="ap-num"><b>Restante</b><span' + (resto > 0 ? ' class="debe"' : '') + '>' + money(resto) + '</span></div>'
    + '</div>'
    + '<div class="ap-foot' + (urge ? ' urge' : '') + '">' + pie + '</div></button>';
}

function listaApartadosHTML(){
  var grupos = { activo: [], vencido: [], liquidado: [] };
  state.apartados.forEach(function(a){ grupos[estadoApartado(a)].push(a); });
  grupos.activo.sort(function(a, b){ return String(a.vence).localeCompare(String(b.vence)); });
  grupos.vencido.sort(function(a, b){ return String(b.vence).localeCompare(String(a.vence)); });
  grupos.liquidado.sort(function(a, b){
    return String(b.liquidadoEn || b.fecha).localeCompare(String(a.liquidadoEn || a.fecha));
  });

  var chips = [['activo','Vigentes'],['vencido','Vencidos'],['liquidado','Liquidados']].map(function(c){
    return '<button class="chip" data-act="ap-filtro" data-value="' + c[0] + '" aria-pressed="' + (apFiltro === c[0]) + '">'
      + c[1] + ' (' + grupos[c[0]].length + ')</button>';
  }).join('');

  var lista = grupos[apFiltro] || [];
  var vacio = apFiltro === 'activo'
    ? 'No hay apartados vigentes. Se crean desde la pestana Vender, marcando "Es un apartado".'
    : apFiltro === 'vencido'
      ? 'Ningun apartado se ha vencido.'
      : 'Todavia no liquidaste ningun apartado.';

  return '<div class="modal-backdrop top" data-act="close-ap">'
    + '<div class="modal-sheet">'
    + '<div class="modal-handle"></div>'
    + '<div class="modal-head"><h2>Apartados</h2>'
    + '<button class="modal-close" data-act="close-ap" aria-label="Cerrar">&times;</button></div>'
    + '<div class="filters">' + chips + '</div>'
    + (lista.length ? lista.map(tarjetaApartadoHTML).join('') : '<div class="hint">' + vacio + '</div>')
    + '</div></div>';
}

function detalleApartadoHTML(){
  var a = apartado(apDetalle);
  if (!a){ apDetalle = null; return listaApartadosHTML(); }

  var est = estadoApartado(a);
  var total = totalApartado(a);
  var ab = abonadoDe(a);
  var resto = restanteDe(a);
  var dias = diasHasta(a.vence);

  var items = a.items.map(function(it){
    var p = find(it.productoId);
    var foto = (p && p.fotos.length)
      ? '<img class="vi-foto" src="' + esc(p.fotos[0]) + '" alt="">'
      : '<span class="vi-foto">&#128086;</span>';
    return '<div class="ap-item">' + foto
      + '<div class="ap-item-body"><div class="ap-item-name">' + esc(it.nombre || (p ? p.nombre : 'Prenda')) + '</div>'
      + '<div class="ap-item-meta">' + it.cantidad + ' u. &middot; ' + esc(it.talla || 'sin talla')
      + ' &middot; ' + money(it.precioUnitario) + ' c/u' + (p ? '' : ' &middot; prenda borrada') + '</div></div>'
      + '<div class="ap-item-sub">' + money(it.precioUnitario * it.cantidad) + '</div></div>';
  }).join('');

  var abonos = a.abonos.length
    ? a.abonos.map(function(x){
        return '<div class="abono-line"><span>' + esc(x.fecha) + '</span><b>&plus;' + money(x.monto) + '</b></div>';
      }).join('')
    : '<div class="hint">Sin abonos registrados: aparto sin dejar nada.</div>';

  var estadoTxt;
  if (est === 'activo'){
    estadoTxt = 'Apartado el ' + fechaCorta(a.fecha) + '. Vence el ' + fechaCorta(a.vence)
      + (dias === 0 ? ' (hoy)' : dias === 1 ? ' (manana)' : ' (en ' + dias + ' dias)') + '.';
  } else if (est === 'vencido'){
    estadoTxt = 'Se vencio el ' + fechaCorta(a.vence) + '. Las prendas ya volvieron al inventario y los '
      + money(ab) + ' abonados quedaron para el negocio.';
  } else {
    estadoTxt = 'Liquidado el ' + fechaCorta(a.liquidadoEn || a.fecha) + '. Las prendas quedaron registradas como vendidas.';
  }

  var acciones;
  if (apAccion === 'del'){
    acciones = confirmApHTML('Se borra el apartado entero: las prendas vuelven al inventario y los '
      + money(ab) + ' abonados dejan de contar en la caja. Usalo solo si lo registraste por error.',
      'ap-do-del', 'Si, borrar', 'solid-danger');
  } else if (apAccion === 'liq'){
    acciones = confirmApHTML((resto > 0
        ? 'Se cobran los ' + money(resto) + ' que faltan y las '
        : 'Ya esta pagado completo. Las ')
      + unidadesDe(a) + ' prenda' + (unidadesDe(a) === 1 ? '' : 's') + ' pasan a vendidas.',
      'ap-do-liq', 'Si, liquidar', '');
  } else if (apAccion === 'undo'){
    acciones = confirmApHTML('Se borran las ventas que genero este apartado y vuelve a quedar pendiente de pago.',
      'ap-do-undo', 'Si, deshacer', 'solid-danger');
  } else if (est === 'liquidado'){
    acciones = '<button class="btn secondary" data-act="ap-arm-undo">Deshacer liquidacion</button>'
      + '<button class="btn danger" style="margin-top:10px" data-act="ap-arm-del">Borrar apartado</button>';
  } else {
    acciones = '<div class="section-title">Registrar un abono</div>'
      + '<div class="inline-form"><input id="ap-abono" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00">'
      + '<button class="btn inline" data-act="ap-abonar">Abonar</button></div>'
      + (resto > 0 ? '<div class="hint" style="margin-top:8px">Faltan ' + money(resto) + '.</div>' : '')
      + '<div class="divider"></div>'
      + '<button class="btn" data-act="ap-arm-liq">'
      + (resto > 0 ? 'Liquidar y cobrar ' + money(resto) : 'Liquidar (ya esta pagado)') + '</button>'
      + (est === 'vencido'
          ? '<div class="hint" style="margin-top:8px">Si el cliente aparece tarde y las prendas siguen en el inventario, puedes liquidarlo igual.</div>'
          : '')
      + '<button class="btn danger" style="margin-top:10px" data-act="ap-arm-del">Borrar apartado</button>';
  }

  return '<div class="modal-backdrop top" data-act="close-ap">'
    + '<div class="modal-sheet">'
    + '<div class="modal-handle"></div>'
    + '<div class="modal-head"><h2>' + esc(a.cliente || 'Apartado') + '</h2>'
    + '<button class="modal-close" data-act="close-ap" aria-label="Cerrar">&times;</button></div>'
    + '<div class="title-row"><button class="linkbtn" data-act="ap-back">&larr; Todos los apartados</button>'
    + '<span class="pill ' + est + '">' + etiquetaEstado(est) + '</span></div>'
    + '<div class="hint" style="margin-top:10px">' + estadoTxt + '</div>'
    + '<div class="divider"></div>'
    + '<div class="section-title">Prendas</div>' + items
    + '<div class="tot-box">'
    + '<div class="tot-row"><span>Total</span><b>' + money(total) + '</b></div>'
    + '<div class="tot-row"><span>Abonado</span><b>' + money(ab) + '</b></div>'
    + '<div class="tot-row big' + (resto > 0 ? ' debe' : '') + '">'
    + '<span>' + (est === 'liquidado' ? 'Sin saldo' : 'Falta por cobrar') + '</span><b>' + money(resto) + '</b></div>'
    + '</div>'
    + '<div class="section-title">Abonos</div>' + abonos
    + '<div class="divider"></div>' + acciones
    + '</div></div>';
}

// Guarda lo tipeado en las tarjetas de proveedor antes de re-renderizar el modal.

  var cards = document.querySelectorAll('#prov-root .prov-card');
  for (var i = 0; i < cards.length; i++){
    var pr = proveedor(cards[i].getAttribute('data-pid'));

function setTab(next){

  if (next !== 'vender') seleccion = [];
