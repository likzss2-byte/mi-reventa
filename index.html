}

function addPhotos(files, done){
  var list = Array.prototype.slice.call(files || []);
  if (!list.length) return;
  Promise.all(list.map(shrink)).then(done, function(){
    toast('No se pudo procesar alguna de las fotos.');
  });
}

// Lee las filas de talla del DOM. Conserva los ids de las variantes que ya existian
// para que las ventas registradas sigan apuntando a la talla correcta.
function readTallaRows(containerId, prev, p){
  var container = document.getElementById(containerId);
  var out = [];
  if (!container) return prev || [];
  var rows = container.querySelectorAll('.talla-row');
  for (var i = 0; i < rows.length; i++){
    var vid = rows[i].getAttribute('data-vid');
    var talla = rows[i].querySelector('.t-name').value.trim();
    var cant = int(rows[i].querySelector('.t-qty').value, 1);
    if (cant < 1) cant = 1;
    if (vid && p){
      var minimo = comprometidasDe(p, vid);
      if (cant < minimo) cant = minimo;
    }
    out.push({ id: vid || uid('v'), talla: talla, cantidad: cant });
  }
  // Ninguna variante con ventas o apartados puede desaparecer aunque falte su fila.
  if (p){
    p.variantes.forEach(function(v){
      var kept = out.some(function(o){ return o.id === v.id; });
      if (!kept && comprometidasDe(p, v.id) > 0) out.push(v);
    });
  }
  if (!out.length) out = [{ id: uid('v'), talla: '', cantidad: 1 }];
  return out;
}

document.addEventListener('click', function(e){
  var tabBtn = e.target.closest('.tab-btn');
  if (tabBtn){ openId = null; askDelete = false; setTab(tabBtn.getAttribute('data-tab')); return; }

  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var val = el.getAttribute('data-value');

  if (act === 'tab'){ setTab(val); return; }
  if (act === 'filter'){ filter = val; render(); return; }
  if (act === 'open'){ openId = val; askDelete = false; renderModal(); return; }
  if (act === 'close'){
    if (e.target !== el) return;
    openId = null; askDelete = false; renderModal(); return;
  }

  if (act === 'pick'){
    var yaEsta = seleccion.indexOf(val);
    if (yaEsta >= 0) seleccion.splice(yaEsta, 1);
    else seleccion.push(val);
    render(); return;
  }
  if (act === 'limpiar-sel'){ seleccion = []; render(); return; }
  if (act === 'abrir-venta'){
    if (!seleccion.length){ toast('Elige al menos una prenda.'); return; }
    ventaItems = seleccion.slice();
    ventaValores = {};
    ventaForm = { fecha: today(), apartado: false, cliente: '', abono: '' };
    ventaOpen = true;
    renderVenta(); return;
  }
  if (act === 'close-venta'){
    if (e.target !== el) return;
    cerrarVenta(false); return;
  }
  if (act === 'quitar-item'){
    cosecharVenta();
    ventaItems = ventaItems.filter(function(x){ return x !== val; });
    seleccion = seleccion.filter(function(x){ return x !== val; });
    if (!ventaItems.length){ cerrarVenta(true); render(); return; }
    renderVenta();
    render();
    return;
  }
  if (act === 'do-venta'){
    cosecharVenta();
    var itemsV = itemsVenta();
    if (!itemsV.length){ toast('No hay prendas en esta venta.'); return; }

    var problema = null;
    var totalV = 0;
    for (var iv = 0; iv < itemsV.length && !problema; iv++){
      var itv = itemsV[iv];
      var pv2 = find(itv.productoId);
      if (!pv2){ problema = 'Una de las prendas ya no existe.'; break; }
      var varv = null;
      for (var jv = 0; jv < pv2.variantes.length; jv++){
        if (pv2.variantes[jv].id === itv.varianteId) varv = pv2.variantes[jv];
      }
      if (!varv){ problema = 'Elige la talla de "' + pv2.nombre + '".'; break; }
      if (itv.cantidad < 1){ problema = 'La cantidad de "' + pv2.nombre + '" tiene que ser 1 o mas.'; break; }
      var libreV = stockDe(pv2, varv);
      if (itv.cantidad > libreV){
        problema = 'De "' + pv2.nombre + '" (' + (varv.talla || 'sin talla') + ') solo quedan ' + libreV + '.';
        break;
      }
      if (!(itv.precioUnitario >= 0)){ problema = 'Revisa el precio de "' + pv2.nombre + '".'; break; }
      itv.nombre = pv2.nombre;
      itv.talla = varv.talla || '';
      totalV += itv.precioUnitario * itv.cantidad;
    }
    if (problema){ toast(problema); return; }

    var fechaV = ventaForm.fecha || today();

    if (!ventaForm.apartado){
      itemsV.forEach(function(it){
        var pp = find(it.productoId);
        if (!pp) return;
        pp.ventas.push({
          id: uid('s'), varianteId: it.varianteId, cantidad: it.cantidad,
          precioUnitario: it.precioUnitario, fecha: fechaV, apartadoId: null
        });
      });
      cerrarVenta(true);
      render(); save();
      toast('Venta registrada: ' + money(totalV) + '.');
      return;
    }

    var clienteV = String(ventaForm.cliente || '').trim();
    if (!clienteV){ toast('Escribe el nombre del cliente que aparta.'); return; }
    var abonoV = num(ventaForm.abono);
    if (abonoV < 0) abonoV = 0;
    if (abonoV > totalV) abonoV = totalV;
    var nuevoAp = {
      id: uid('ap'),
      cliente: clienteV,
      fecha: fechaV,
      vence: fechaMas(fechaV, DIAS_APARTADO),
      estado: 'activo',
      liquidadoEn: '',
      items: itemsV.map(function(it){
        return {
          productoId: it.productoId, varianteId: it.varianteId, nombre: it.nombre,
          talla: it.talla, cantidad: it.cantidad, precioUnitario: it.precioUnitario
        };
      }),
      abonos: abonoV > 0 ? [{ id: uid('ab'), monto: abonoV, fecha: fechaV }] : []
    };
    state.apartados.unshift(nuevoAp);
    cerrarVenta(true);
    render(); save();
    toast('Apartado de ' + clienteV + ': faltan ' + money(totalV - abonoV) + ' hasta el ' + fechaCorta(nuevoAp.vence) + '.');
    return;
  }

  if (act === 'add-talla'){
    var box = document.getElementById(val);
    if (!box) return;
    box.insertAdjacentHTML('beforeend', tallaRowHTML(null, 0, 0));
    return;
  }
  if (act === 'del-talla'){
    var row = el.closest('.talla-row');
    var parent = row.parentNode;
    if (parent.querySelectorAll('.talla-row').length <= 1){ toast('Tiene que quedar al menos una talla.'); return; }
    row.remove();
    return;
  }

  if (act === 'drop-draft'){
    drafts.splice(Number(val), 1);
    document.getElementById('f-strip').innerHTML = stripHTML(drafts, 'drop-draft');
    return;
  }
  if (act === 'drop-photo'){
    var pd = find(openId); if (!pd) return;
    pd.fotos.splice(Number(val), 1);
    document.getElementById('m-strip').innerHTML = stripHTML(pd.fotos, 'drop-photo');
    save(); return;
  }

  if (act === 'open-prov'){ provOpen = true; armedProv = null; renderProveedores(); return; }
  if (act === 'close-prov'){
    if (e.target !== el) return;
    cosecharProveedores();
    provOpen = false; armedProv = null;
    render(); save(); return;
  }
  if (act === 'add-prov'){
    var nom = document.getElementById('pv-nuevo').value.trim();
    if (!nom){ toast('Escribe el nombre del proveedor.'); return; }
    cosecharProveedores();
    var repetido = state.proveedores.some(function(v){ return v.nombre.trim().toLowerCase() === nom.toLowerCase(); });
    if (repetido){ toast('Ya tienes un proveedor con ese nombre.'); return; }
    state.proveedores.push({ id: uid('pr'), nombre: nom, contacto: document.getElementById('pv-nuevo-contacto').value.trim() });
    armedProv = null;
    render(); save(); toast('Proveedor "' + nom + '" agregado.');
    return;
  }
  if (act === 'save-prov'){
    cosecharProveedores();
    provOpen = false; armedProv = null;
    render(); save(); toast('Proveedores guardados.');
    return;
  }
  if (act === 'arm-prov'){ cosecharProveedores(); armedProv = val; renderProveedores(); return; }
  if (act === 'del-prov'){
    cosecharProveedores();
    var pr = proveedor(val);
    // Las prendas no se borran: conservan el nombre como texto y quedan sin proveedor.
    state.products.forEach(function(p){
      if (p.proveedorId === val){
        p.dondeLoCompre = pr ? pr.nombre : p.dondeLoCompre;
        p.proveedorId = null;
      }
    });
    state.proveedores = state.proveedores.filter(function(v){ return v.id !== val; });
    armedProv = null;
    render(); save(); toast('Proveedor "' + (pr ? pr.nombre : '') + '" borrado.');
    return;
  }

  if (act === 'signin-google'){
    signInWithPopup(auth, new GoogleAuthProvider()).catch(function(err){
      if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) return;
      if (err && err.code === 'auth/popup-blocked'){
        toast('El navegador bloqueo la ventana. Permite ventanas emergentes para este sitio.');
        return;
      }
      toast('No se pudo iniciar sesion' + (err && err.code ? ' (' + err.code + ')' : '') + '.');
    });
    return;
  }
  if (act === 'signout'){ signOut(auth); return; }
  if (act === 'reintentar'){ location.reload(); return; }

  if (act === 'open-pap'){ papOpen = true; armedPap = null; cargarPapelera(); return; }
  if (act === 'close-pap'){
    if (e.target !== el) return;
    papOpen = false; armedPap = null; renderPapelera(); return;
  }
  if (act === 'arm-pap'){ armedPap = val; renderPapelera(); return; }
  if (act === 'cancel-pap'){ armedPap = null; renderPapelera(); return; }
  if (act === 'restaurar-pap'){
    var recuperada = null;
    papEntradas.forEach(function(p){ if (p.id === val) recuperada = p; });
    if (!recuperada){ toast('No se encontro esa prenda.'); return; }
    var limpia = JSON.parse(JSON.stringify(recuperada));
    delete limpia.borradoEn;
    delete limpia.borradoPor;
    if (find(limpia.id)){ toast('Esa prenda ya esta en el inventario.'); return; }
    state.products.unshift(limpia);
    // Vuelve con sus ventas, asi que se retira el asiento que las representaba
    // mientras estuvo borrada; si no, el dinero contaria dos veces.
    state.cerradas = state.cerradas.filter(function(c){ return c.id !== limpia.id; });
    papEntradas = papEntradas.filter(function(p){ return p.id !== val; });
    deleteDoc(doc(colPapelera, val)).catch(function(){});
    papOpen = false; armedPap = null;
    render(); save();
    toast('"' + limpia.nombre + '" restaurada con sus fotos.');
    return;
  }
  if (act === 'purgar-pap'){
    var nombrePurgado = '';
    papEntradas.forEach(function(p){ if (p.id === val) nombrePurgado = p.nombre; });
    papEntradas = papEntradas.filter(function(p){ return p.id !== val; });
    armedPap = null;
    deleteDoc(doc(colPapelera, val)).catch(function(){});
    renderPapelera();
    toast('"' + nombrePurgado + '" borrada definitivamente.');
    return;
  }

  if (act === 'avisos-on'){ activarAvisos(); return; }
  if (act === 'avisos-off'){ desactivarAvisos(); return; }
  if (act === 'aviso-prueba'){ avisoDePrueba(); return; }

  if (act === 'open-ap'){
    apOpen = true; apDetalle = null; apAccion = null;
    apFiltro = 'activo';
    renderApartados(); return;
  }
  if (act === 'close-ap'){
    if (e.target !== el) return;
    apOpen = false; apDetalle = null; apAccion = null; renderApartados(); return;
  }
  if (act === 'ap-filtro'){ apFiltro = val; renderApartados(); return; }
  if (act === 'ap-open'){ apDetalle = val; apAccion = null; renderApartados(); return; }
  if (act === 'ap-back'){ apDetalle = null; apAccion = null; renderApartados(); return; }
  if (act === 'ap-cancel'){ apAccion = null; renderApartados(); return; }
  if (act === 'ap-arm-del'){ apAccion = 'del'; renderApartados(); return; }
  if (act === 'ap-arm-liq'){ apAccion = 'liq'; renderApartados(); return; }
  if (act === 'ap-arm-undo'){ apAccion = 'undo'; renderApartados(); return; }

  if (act === 'ap-abonar'){
    var apAb = apartado(apDetalle); if (!apAb) return;
    var campoAb = document.getElementById('ap-abono');
    var montoAb = num(campoAb ? campoAb.value : 0);
    if (montoAb <= 0){ toast('Escribe cuanto abono el cliente.'); return; }
    var faltaAb = restanteDe(apAb);
    if (faltaAb <= 0){ toast('Este apartado ya esta pagado completo.'); return; }
    if (montoAb > faltaAb){
      montoAb = faltaAb;
      toast('Solo faltaban ' + money(faltaAb) + ', se anoto eso.');
    }
    apAb.abonos.push({ id: uid('ab'), monto: montoAb, fecha: today() });
    render(); save();
    var restaAhora = restanteDe(apAb);
    toast(restaAhora === 0
      ? 'Abono anotado. Ya esta pagado completo: puedes liquidarlo.'
      : 'Abono de ' + money(montoAb) + ' anotado. Faltan ' + money(restaAhora) + '.');
    return;
  }

  if (act === 'ap-do-liq'){
    var apLiq = apartado(apDetalle); if (!apLiq) return;
    // Si ya se habia vencido, las prendas volvieron al inventario: hay que confirmar
    // que siguen ahi y no se le vendieron a alguien mas.
    var sinStock = null;
    if (estadoApartado(apLiq) !== 'activo'){
      apLiq.items.forEach(function(it){
        if (sinStock) return;
        var pp = find(it.productoId);
        if (!pp){ sinStock = it.nombre || 'Una prenda'; return; }
        var vv = null;
        pp.variantes.forEach(function(x){ if (x.id === it.varianteId) vv = x; });
        if (!vv || stockDe(pp, vv) < it.cantidad) sinStock = it.nombre || pp.nombre;
      });
    }
    if (sinStock){
      apAccion = null; renderApartados();
      toast('Ya no hay stock de "' + sinStock + '": se vendio despues de que vencio.');
      return;
    }
    var restoLiq = restanteDe(apLiq);
    apLiq.items.forEach(function(it){
      var pp = find(it.productoId);
      if (!pp) return;
      pp.ventas.push({
        id: uid('s'), varianteId: it.varianteId, cantidad: it.cantidad,
        precioUnitario: it.precioUnitario, fecha: today(), apartadoId: apLiq.id
      });
    });
    apLiq.estado = 'liquidado';
    apLiq.liquidadoEn = today();
    apAccion = null;
    render(); save();
    toast(restoLiq > 0 ? 'Liquidado. Entraron ' + money(restoLiq) + ' a la caja.' : 'Apartado liquidado.');
    return;
  }

  if (act === 'ap-do-undo'){
    var apUndo = apartado(apDetalle); if (!apUndo) return;
    // Si alguna prenda ya no existe, sus ventas no se pueden devolver y el abonado
    // volveria a contarse encima de lo ya cobrado.
    var faltaPrenda = apUndo.items.some(function(it){ return !find(it.productoId); });
    if (faltaPrenda){
      apAccion = null; renderApartados();
      toast('Alguna de sus prendas ya no esta en el inventario. Deshacerlo descuadraria la caja.');
      return;
    }
    state.products.forEach(function(pp){
      pp.ventas = pp.ventas.filter(function(s){ return s.apartadoId !== apUndo.id; });
    });
    apUndo.estado = 'activo';
    apUndo.liquidadoEn = '';
    apAccion = null;
    apFiltro = estadoApartado(apUndo);
    render(); save();
    toast('Liquidacion deshecha: el apartado vuelve a quedar pendiente.');
    return;
  }

  if (act === 'ap-do-del'){
    var apDel = apartado(apDetalle); if (!apDel) return;
    state.products.forEach(function(pp){
      pp.ventas = pp.ventas.filter(function(s){ return s.apartadoId !== apDel.id; });
    });
    state.apartados = state.apartados.filter(function(x){ return x.id !== apDel.id; });
    apDetalle = null; apAccion = null;
    render(); save();
    toast('Apartado de ' + (apDel.cliente || 'sin nombre') + ' borrado.');
    return;
  }

  if (act === 'open-hist'){ histOpen = true; armedHist = null; cargarHistorial(); return; }
  if (act === 'close-hist'){
    if (e.target !== el) return;
    histOpen = false; armedHist = null; renderHistorial(); return;
  }
  if (act === 'arm-hist'){ armedHist = val; renderHistorial(); return; }
  if (act === 'cancel-hist'){ armedHist = null; renderHistorial(); return; }
  if (act === 'do-restore'){
    var entrada = null;
    histEntradas.forEach(function(v){ if (v.id === val) entrada = v; });
    if (!entrada){ toast('No se encontro esa version.'); return; }
    var datos;
    try{
      datos = JSON.parse(entrada.datos);
    }catch(err){
      toast('Esa version esta danada y no se puede restaurar.');
      return;
    }
    // El historial no guarda fotos. Se reponen desde las prendas actuales, y para las
    // que ya no existen, desde la papelera.
    var fotosActuales = {};
    state.products.forEach(function(p){ fotosActuales[p.id] = p.fotos; });
    datos = migrate(datos);
    datos.products.forEach(function(p){
      if ((!p.fotos || !p.fotos.length) && fotosActuales[p.id]) p.fotos = fotosActuales[p.id];
    });

    var faltantes = datos.products.filter(function(p){ return !p.fotos || !p.fotos.length; });
    var aplicar = function(){
      state = datos;
      histOpen = false; armedHist = null;
      openId = null; provOpen = false;
      ultimoArchivado = 0;   // la version restaurada debe quedar archivada enseguida
      render(); save();
      toast('Restaurado: ' + state.products.length + ' prenda' + (state.products.length === 1 ? '' : 's') + '.');
    };

    if (!faltantes.length){ aplicar(); return; }
    Promise.all(faltantes.map(function(p){
      return getDoc(doc(colPapelera, p.id)).then(function(snap){
        if (snap.exists()){
          var v = snap.data();
          if (v.fotos && v.fotos.length) p.fotos = v.fotos;
        }
      }).catch(function(){});
    })).then(aplicar, aplicar);
    return;
  }

  if (act === 'respaldo'){ descargarRespaldo(); return; }

  if (act === 'arm-gasto'){ armedGasto = val; render(); return; }
  if (act === 'del-gasto'){
    var borrado = null;
    state.gastos = state.gastos.filter(function(g){
      if (g.id === val){ borrado = g; return false; }
      return true;
    });
    armedGasto = null;
    render(); save();
    toast('Gasto "' + (borrado ? borrado.concepto : '') + '" borrado.');
    return;
  }
  if (act === 'update'){
    var pu = find(openId); if (!pu) return;
    var nombre = document.getElementById('m-nombre').value.trim();
    var costo = parseFloat(document.getElementById('m-costo').value);
    var precio = parseFloat(document.getElementById('m-precio').value);
    if (!nombre || isNaN(costo) || isNaN(precio)){ toast('Completa nombre, costo y precio de venta.'); return; }
    pu.variantes = readTallaRows('m-tallas', pu.variantes, pu);
    pu.nombre = nombre;
    pu.proveedorId = resolverProveedor('m-prov');
    pu.costo = costo;
    pu.precioVenta = precio;
    pu.stockInicial = document.getElementById('m-inicial').checked;
    render(); save(); toast('Cambios guardados.'); return;
  }

  if (act === 'sell'){
    var ps = find(openId); if (!ps) return;
    var vid = document.getElementById('s-variante').value;
    var variante = null;
    ps.variantes.forEach(function(v){ if (v.id === vid) variante = v; });
    if (!variante){ toast('Elige una talla.'); return; }
    var cant = int(document.getElementById('s-cant').value, 0);
    var precioU = parseFloat(document.getElementById('s-precio').value);
    var fecha = document.getElementById('s-fecha').value || today();
    if (cant < 1){ toast('La cantidad tiene que ser 1 o mas.'); return; }
    var libre = stockDe(ps, variante);
    if (cant > libre){ toast('Solo quedan ' + libre + ' de esa talla.'); return; }
    if (isNaN(precioU)){ toast('Escribe el precio de venta.'); return; }
    ps.ventas.push({ id: uid('s'), varianteId: vid, cantidad: cant, precioUnitario: precioU, fecha: fecha });
    render(); save();
    toast('Venta registrada: ' + money(precioU * cant) + '.');
    return;
  }

  if (act === 'undo-venta'){
    var pv = find(openId); if (!pv) return;
    var ventaObj = null;
    pv.ventas.forEach(function(s){ if (s.id === val) ventaObj = s; });
    // Las ventas que salieron de liquidar un apartado se deshacen desde el apartado,
    // asi no queda marcado como cobrado sin tener sus ventas.
    if (ventaObj && ventaObj.apartadoId){
      var duenio = apartado(ventaObj.apartadoId);
      toast('Esa venta salio de un apartado' + (duenio && duenio.cliente ? ' de ' + duenio.cliente : '')
        + '. Deshazla desde Resumen, en Apartados.');
      return;
    }
    pv.ventas = pv.ventas.filter(function(s){ return s.id !== val; });
    render(); save(); toast('Venta deshecha.'); return;
  }

  if (act === 'ask-delete'){ askDelete = true; renderModal(); return; }
  if (act === 'cancel-delete'){ askDelete = false; renderModal(); return; }
  if (act === 'confirm-delete'){
    var borrada = find(openId);
    if (!borrada){ openId = null; askDelete = false; renderModal(); return; }
    // Con apartados vigentes no se borra: el cliente tiene esas unidades reservadas
    // y su dinero abonado depende de que el apartado siga cuadrando.
    if (apartadas(borrada) > 0){
      askDelete = false; renderModal();
      toast('Tiene unidades en apartados vigentes. Liquida o borra ese apartado primero.');
      return;
    }
    var teniaVentas = vendidas(borrada) > 0;
    // Se copia a la papelera ANTES de quitarla, para poder devolverla con sus fotos,
    // y se asienta su paso por la caja para que el dinero no se mueva al borrarla.
    mandarAPapelera(borrada);
    cerrarPrenda(borrada);
    state.products = state.products.filter(function(x){ return x.id !== openId; });
    openId = null; askDelete = false;
    render(); save();
    toast('"' + borrada.nombre + '" movida a la papelera.'
      + (teniaVentas ? ' El dinero de sus ventas se queda en la caja.' : ''));
    return;
  }
});

document.addEventListener('submit', function(e){
  if (e.target.id === 'add-form'){
    e.preventDefault();
    var nombre = document.getElementById('f-nombre').value.trim();
    var costo = parseFloat(document.getElementById('f-costo').value);
    var precio = parseFloat(document.getElementById('f-precio').value);
    if (!nombre || isNaN(costo) || isNaN(precio)){ toast('Completa nombre, costo y precio de venta.'); return; }
    var esInicial = document.getElementById('f-inicial').checked;
    var variantes = readTallaRows('f-tallas', null, null);
    state.products.unshift({
      id: uid('p'),
      nombre: nombre,
      proveedorId: resolverProveedor('f-prov'),
      dondeLoCompre: '',
      costo: costo,
      precioVenta: precio,
      stockInicial: esInicial,
      fotos: drafts.slice(),
      fechaCompra: today(),
      variantes: variantes,
      ventas: []
    });
    var unidades = variantes.reduce(function(a, v){ return a + v.cantidad; }, 0);
    drafts = [];
    setTab('inventario');
    save();
    toast(unidades + ' unidad' + (unidades === 1 ? '' : 'es') + ' agregada' + (unidades === 1 ? '' : 's')
      + (esInicial ? ', sin tocar la caja.' : '.'));
    return;
  }

  if (e.target.id === 'gasto-form'){
    e.preventDefault();
    var concepto = document.getElementById('g-concepto').value.trim();
    var monto = parseFloat(document.getElementById('g-monto').value);
    var fechaMov = document.getElementById('g-fecha').value || today();
    if (!concepto || isNaN(monto)){ toast('Escribe el concepto y el monto.'); return; }
    state.gastos.unshift({
      id: uid('g'),
      concepto: concepto,
      monto: monto,
      categoria: document.getElementById('g-categoria').value,
      fecha: fechaMov
    });
    armedGasto = null;
    render(); save();
    toast('Gasto de ' + money(monto) + ' anotado.');
  }
});

// Los campos del formulario de venta se actualizan en el sitio, sin volver a dibujarlo,
// para no borrar lo que la persona ya escribio.
document.addEventListener('input', function(e){
  if (!ventaOpen || !e.target.closest) return;
  if (!e.target.closest('#venta-root')) return;
  actualizarTotalesVenta();
});

document.addEventListener('change', function(e){
  if (e.target.id === 'v-apartado'){
    ventaForm.apartado = e.target.checked;
    var cajaAp = document.getElementById('v-ap-box');
    if (cajaAp) cajaAp.hidden = !ventaForm.apartado;
    var botonV = document.getElementById('v-submit');
    if (botonV) botonV.textContent = ventaForm.apartado ? 'Registrar apartado' : 'Registrar venta';
    var tituloV = document.querySelector('#venta-root .modal-head h2');
    if (tituloV) tituloV.textContent = ventaForm.apartado ? 'Nuevo apartado' : 'Registrar venta';
    actualizarTotalesVenta();
    return;
  }
  if (e.target.id === 'v-fecha'){
    ventaForm.fecha = e.target.value || today();
    var plazo = document.getElementById('v-plazo');
    if (plazo) plazo.textContent = fechaCorta(fechaMas(ventaForm.fecha, DIAS_APARTADO));
    return;
  }
  if (ventaOpen && e.target.closest && e.target.closest('#venta-root')){
    actualizarTotalesVenta();
    return;
  }
  // "Proveedor nuevo..." revela el campo para escribir el nombre.
  var campoNuevo = e.target.getAttribute && e.target.getAttribute('data-nuevo');
  if (campoNuevo){
    var input = document.getElementById(campoNuevo);
    if (input){
      var mostrar = e.target.value === '__nuevo__';
      input.hidden = !mostrar;
      if (mostrar) input.focus();
    }
    return;
  }
  if (e.target.id === 'f-restaurar'){
    if (e.target.files && e.target.files[0]) restaurarRespaldo(e.target.files[0]);
    return;
  }
  if (e.target.id === 'f-capital'){
    state.capitalInicial = num(e.target.value);
    render(); save(); return;
  }
  if (e.target.id === 'f-fotos'){
    addPhotos(e.target.files, function(urls){
      drafts = drafts.concat(urls);
      document.getElementById('f-strip').innerHTML = stripHTML(drafts, 'drop-draft');
    });
    return;
  }
  if (e.target.id === 'm-fotos'){
    var pf = find(openId); if (!pf) return;
    addPhotos(e.target.files, function(urls){
      pf.fotos = pf.fotos.concat(urls);
      var strip = document.getElementById('m-strip');
      if (strip) strip.innerHTML = stripHTML(pf.fotos, 'drop-photo');
      save();
    });
  }
});

try{
  if (/[?&]ver=apartados\b/.test(location.search)){
    abrirApartadosAlCargar = true;
    // Se limpia la direccion para que recargar no vuelva a abrir el mismo panel.
    if (history.replaceState) history.replaceState(null, '', location.pathname);
  }
}catch(e){}

renderGate();
})();
</script>
