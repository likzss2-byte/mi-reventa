<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Reventa</title>
<meta name="description" content="Control de inventario y caja para reventa de ropa.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Reventa">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2EFF4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17131C" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" href="icono.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Albert+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style id="app-style">
*{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#F2EFF4;--surface:#FFFFFF;--surface-2:#F7F4FA;--border:#E2DCE9;
  --text:#221B28;--text-muted:#6D6377;
  --accent:#9A2F55;--accent-hover:#7E2544;--accent-contrast:#FFFFFF;
  --success:#2C7A57;--success-bg:#E0F1E8;
  --info:#3A6BA5;--info-bg:#E3ECF7;
  --danger:#B03F38;--danger-bg:#F8E6E4;
  --warn:#8A6218;--warn-bg:#F7EEDA;
  --toast-bg:#221B28;--toast-fg:#F2EFF4;
  --shadow:0 1px 2px rgba(34,27,40,.06),0 6px 16px rgba(34,27,40,.07);
  --radius:16px;--radius-sm:10px;
  --font-display:'Big Shoulders Display',system-ui,sans-serif;
  --font-body:'Albert Sans',system-ui,-apple-system,sans-serif;
  --font-mono:'Space Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#17131C;--surface:#211B27;--surface-2:#2A2331;--border:#3B3342;
    --text:#F1ECF5;--text-muted:#AEA4BA;
    --accent:#EB98B8;--accent-hover:#F2ADC6;--accent-contrast:#25101A;
    --success:#72CDA0;--success-bg:rgba(114,205,160,.15);
    --info:#8CB6E2;--info-bg:rgba(140,182,226,.15);
    --danger:#E4938B;--danger-bg:rgba(228,147,139,.15);
    --warn:#E0BE79;--warn-bg:rgba(224,190,121,.15);
    --toast-bg:#F1ECF5;--toast-fg:#17131C;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#17131C;--surface:#211B27;--surface-2:#2A2331;--border:#3B3342;
  --text:#F1ECF5;--text-muted:#AEA4BA;
  --accent:#EB98B8;--accent-hover:#F2ADC6;--accent-contrast:#25101A;
  --success:#72CDA0;--success-bg:rgba(114,205,160,.15);
  --info:#8CB6E2;--info-bg:rgba(140,182,226,.15);
  --danger:#E4938B;--danger-bg:rgba(228,147,139,.15);
  --warn:#E0BE79;--warn-bg:rgba(224,190,121,.15);
  --toast-bg:#F1ECF5;--toast-fg:#17131C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;color:inherit}
.app{min-height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 18px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:var(--font-body);font-weight:600;font-size:9.5px;letter-spacing:.13em;color:var(--text-muted);text-transform:uppercase;margin-top:3px}
.topbar-total{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:999px;background:var(--info-bg);color:var(--info);white-space:nowrap}
.topbar-total.neg{background:var(--danger-bg);color:var(--danger)}
.content{flex:1;padding:16px 16px 104px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0)}
.tabbar-inner{display:flex;width:100%;max-width:640px}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;padding:10px 2px 9px;cursor:pointer;color:var(--text-muted);font-size:10px;font-weight:600;letter-spacing:.01em}
.tab-btn .ic{font-size:18px;line-height:1}
.tab-btn[aria-selected="true"]{color:var(--accent)}
.tab-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;border-radius:8px}
h2{font-family:var(--font-display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:.02em}
.section-title{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin:0 0 12px}
.hero-tile+.section-title,.stat-grid+.section-title,.bar-compare+.section-title,.cap-box+.section-title,.gasto-list+.section-title{margin-top:26px}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;width:100%;padding:0}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card-photo{aspect-ratio:1/1;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:30px}
.card-photo img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px}
.card-name{font-weight:700;font-size:14px;line-height:1.25}
.card-meta{font-size:11.5px;color:var(--text-muted)}
.card-prices{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.card-price{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;width:fit-content}
.pill.stock{background:var(--info-bg);color:var(--info)}
.pill.agotado{background:var(--success-bg);color:var(--success)}
.pill.inicial{background:var(--warn-bg);color:var(--warn)}
.gain-pos{color:var(--success);font-weight:700}
.gain-neg{color:var(--danger);font-weight:700}
.empty{text-align:center;padding:44px 20px;color:var(--text-muted);font-size:14px;line-height:1.6}
.empty .ic{font-size:38px;display:block;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-contrast);border:none;padding:13px 20px;border-radius:var(--radius-sm);font-weight:700;font-size:15px;cursor:pointer;width:100%}
.btn:active{background:var(--accent-hover)}
.btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--danger-bg);color:var(--danger)}
.btn.solid-danger{background:var(--danger);color:#fff}
.btn.inline{width:auto;padding:12px 22px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.field label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px;font-size:16px;width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check-row{display:flex;align-items:flex-start;gap:11px;background:var(--warn-bg);border-radius:var(--radius-sm);padding:13px;margin-bottom:15px;cursor:pointer}
.check-row input{width:21px;height:21px;margin:0;flex-shrink:0;accent-color:var(--accent)}
.check-row .ct{display:block;font-size:13.5px;font-weight:700;line-height:1.3}
.check-row .cs{display:block;font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.4}
.photo-picker{border:1.5px dashed var(--border);border-radius:var(--radius-sm);padding:15px;text-align:center;color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;background:var(--surface-2);display:block}
.photo-picker input{display:none}
.photo-strip{display:flex;gap:8px;flex-wrap:wrap}
.photo-strip:empty{display:none}
.photo-thumb{position:relative;width:64px;height:64px;border-radius:9px;overflow:hidden;background:var(--surface-2)}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb button{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:12px;line-height:1;cursor:pointer;padding:0}
.talla-rows{display:flex;flex-direction:column;gap:8px}
.talla-row{display:flex;gap:8px;align-items:center}
.talla-row input{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;font-size:16px;min-width:0}
.talla-row .t-name{flex:1}
.talla-row .t-qty{width:78px;text-align:center;font-variant-numeric:tabular-nums}
.talla-row .t-sold{font-size:11px;color:var(--text-muted);white-space:nowrap;width:66px}
.talla-row .t-del{background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.row-add{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:8px 0;text-align:left;width:fit-content}
.hero-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border-left:5px solid var(--accent)}
.hero-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--text-muted);margin-bottom:8px}
.hero-value{font-family:var(--font-mono);font-weight:700;font-size:33px;font-variant-numeric:tabular-nums;line-height:1}
.hero-value.neg{color:var(--danger)}
.hero-sub{font-size:12px;color:var(--text-muted);margin-top:9px;line-height:1.55}
.hero-note{font-size:11.5px;color:var(--warn);margin-top:7px;line-height:1.45;font-weight:600}
.cap-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;display:flex;align-items:center;gap:10px;margin-top:12px}
.cap-box label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);flex:1}
.cap-box input{width:118px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;font-size:16px;text-align:right;font-variant-numeric:tabular-nums}
.cap-box input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);margin-bottom:7px}
.stat-value{font-family:var(--font-mono);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.stat-value.success{color:var(--success)}
.stat-value.danger{color:var(--danger)}
.stat-value.info{color:var(--info)}
.stat-value.warn{color:var(--warn)}
.bar-compare{margin-bottom:4px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{width:82px;font-size:12px;color:var(--text-muted);font-weight:600;flex-shrink:0}
.bar-track{flex:1;height:14px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;min-width:2px}
.bar-fill.cost{background:var(--info)}
.bar-fill.rev{background:var(--success)}
.bar-fill.exp{background:var(--warn)}
.bar-value{font-family:var(--font-mono);font-size:11.5px;width:78px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums}
.sale-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.sale-item:last-child{border-bottom:none}
.sale-name{font-weight:600;font-size:14px}
.sale-date{font-size:11px;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.sale-gain{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sale-gain.pos{color:var(--success)}
.sale-gain.neg{color:var(--danger)}
.venta-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.venta-row:last-child{border-bottom:none}
.venta-main{font-size:13.5px;font-weight:600}
.venta-date{font-size:11px;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.venta-total{font-family:var(--font-mono);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.venta-undo{background:none;border:none;color:var(--text-muted);font-size:11.5px;font-weight:700;cursor:pointer;text-decoration:underline;padding:2px 0}
.gasto-list{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:2px 14px}
.gasto-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)}
.gasto-row:last-child{border-bottom:none}
.gasto-info{min-width:0}
.gasto-name{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.gasto-meta{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gasto-cat{background:var(--surface-2);border-radius:999px;padding:2px 8px;font-weight:700;letter-spacing:.03em}
.gasto-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
.gasto-monto{font-family:var(--font-mono);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;color:var(--warn);white-space:nowrap}
.gasto-monto.entra{color:var(--success)}
.gasto-del{background:none;border:none;color:var(--text-muted);font-size:19px;cursor:pointer;padding:0 2px;line-height:1}
.gasto-del.armed{color:var(--danger);font-size:11.5px;font-weight:700;text-decoration:underline}
.linkrow{display:flex;justify-content:flex-end;margin:-9px 0 15px}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:700;font-size:12.5px;cursor:pointer;padding:4px 0;text-decoration:underline}
.prov-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;margin-bottom:10px}
.prov-top{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.prov-top input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:16px;font-weight:600}
.prov-top input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.prov-del{background:none;border:none;color:var(--text-muted);font-size:19px;cursor:pointer;padding:0 3px;line-height:1;flex-shrink:0}
.prov-del.armed{color:var(--danger);font-size:11.5px;font-weight:700;text-decoration:underline;white-space:nowrap}
.prov-contacto{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;font-size:15px}
.prov-contacto:focus{outline:2px solid var(--accent);outline-offset:-1px}
.prov-stats{font-size:11.5px;color:var(--text-muted);margin-top:8px;font-variant-numeric:tabular-nums}
.prov-card .btn.secondary{background:var(--surface)}
.prov-card .btn.secondary:active{background:var(--bg)}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,15,24,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal-backdrop.top{z-index:30}
.modal-sheet{background:var(--surface);width:100%;max-width:640px;max-height:92dvh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom,0))}
.modal-handle{width:36px;height:4px;border-radius:999px;background:var(--border);margin:0 auto 14px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.modal-head h2{font-size:20px}
.modal-close{background:none;border:none;color:var(--text-muted);font-size:24px;cursor:pointer;line-height:1;padding:0 4px}
.divider{height:1px;background:var(--border);margin:16px 0}
.sell-box{background:var(--info-bg);border-radius:var(--radius-sm);padding:14px}
.confirm-box{background:var(--danger-bg);border-radius:var(--radius-sm);padding:14px;display:flex;flex-direction:column;gap:10px}
.confirm-text{font-size:13.5px;font-weight:600;color:var(--danger)}
.confirm-actions{display:flex;gap:10px}
.confirm-actions .btn{flex:1}
.hint{font-size:12.5px;color:var(--text-muted);line-height:1.5}
.toast-root{position:fixed;top:14px;left:0;right:0;z-index:40;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--toast-bg);color:var(--toast-fg);padding:10px 17px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:86%;text-align:center}
.gate{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center;background:var(--bg)}
.gate-icon{font-size:40px}
.gate-brand{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.03em;text-transform:uppercase}
.gate-text{font-size:14px;color:var(--text-muted);line-height:1.6;max-width:320px}
.btn-google{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--text);border:1px solid var(--border);padding:13px 22px;border-radius:var(--radius-sm);font-weight:700;font-size:15px;cursor:pointer;box-shadow:var(--shadow);margin-top:6px}
.btn-google:active{background:var(--surface-2)}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:no-preference){
  .modal-sheet{animation:slideup .22s ease-out}
  .toast{animation:fadein .18s ease-out}
}
@keyframes slideup{from{transform:translateY(26px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <span class="brand">Mi Reventa<small>Control de prendas</small></span>
    <span class="topbar-total" id="topbar-total">&#8212;</span>
  </header>
  <main class="content" id="content"></main>
  <nav class="tabbar">
    <div class="tabbar-inner">
      <button class="tab-btn" data-tab="inventario"><span class="ic">&#128084;</span>Inventario</button>
      <button class="tab-btn" data-tab="agregar"><span class="ic">&#43;</span>Agregar</button>
      <button class="tab-btn" data-tab="gastos"><span class="ic">&#129534;</span>Caja</button>
      <button class="tab-btn" data-tab="resumen"><span class="ic">&#128200;</span>Resumen</button>
    </div>
  </nav>
  <div id="modal-root"></div>
  <div id="prov-root"></div>
  <div id="hist-root"></div>
  <div id="gate-root"></div>
  <div class="toast-root" id="toast-root"></div>
</div>
<script id="app-logic" type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc,
  query, orderBy, limit, getDocs, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n){ return n < 10 ? '0' + n : '' + n; }
function today(){ var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }

function num(v){ var n = Number(v); return isFinite(n) ? n : 0; }
function int(v, fallback){ var n = parseInt(v, 10); return (isNaN(n) || n < 0) ? fallback : n; }

// Migra formatos viejos: prendas sueltas (estado en_venta/vendido) a variantes+ventas,
// y agrega los campos nuevos (stockInicial, gastos) si el estado guardado no los tiene.
function migrate(raw){
  var s = (raw && typeof raw === 'object') ? raw : {};
  var out = {
    capitalInicial: num(s.capitalInicial),
    products: Array.isArray(s.products) ? s.products : [],
    gastos: Array.isArray(s.gastos) ? s.gastos : [],
    ingresos: Array.isArray(s.ingresos) ? s.ingresos : [],
    proveedores: Array.isArray(s.proveedores) ? s.proveedores : []
  };
  out.proveedores = out.proveedores.map(function(v){
    return { id: v.id || uid('pr'), nombre: v.nombre || '', contacto: v.contacto || '' };
  });
  // Los textos libres de "donde la compre" que ya existan se convierten en proveedores,
  // uno por nombre distinto, para no perder de donde vino cada prenda.
  function proveedorPorNombre(nombre){
    var clave = nombre.trim().toLowerCase();
    for (var i = 0; i < out.proveedores.length; i++){
      if (out.proveedores[i].nombre.trim().toLowerCase() === clave) return out.proveedores[i];
    }
    var nuevo = { id: uid('pr'), nombre: nombre.trim(), contacto: '' };
    out.proveedores.push(nuevo);
    return nuevo;
  }
  out.products = out.products.map(function(p){
    var q = {
      id: p.id || uid('p'),
      nombre: p.nombre || '',
      proveedorId: p.proveedorId || null,
      dondeLoCompre: p.dondeLoCompre || '',
      costo: num(p.costo),
      precioVenta: num(p.precioVenta),
      stockInicial: p.stockInicial === true,
      fotos: Array.isArray(p.fotos) ? p.fotos : [],
      fechaCompra: p.fechaCompra || today(),
      variantes: Array.isArray(p.variantes) ? p.variantes : null,
      ventas: Array.isArray(p.ventas) ? p.ventas : null
    };
    if (!q.variantes){
      q.variantes = [{ id: uid('v'), talla: '', cantidad: 1 }];
    }
    if (!q.ventas){
      q.ventas = [];
      if (p.estado === 'vendido'){
        q.ventas.push({
          id: uid('s'),
          varianteId: q.variantes[0].id,
          cantidad: 1,
          precioUnitario: num(p.precioVentaFinal),
          fecha: p.fechaVenta || q.fechaCompra
        });
      }
    }
    q.variantes = q.variantes.map(function(v){
      return { id: v.id || uid('v'), talla: v.talla || '', cantidad: int(v.cantidad, 1) };
    });
    q.ventas = q.ventas.map(function(v){
      return {
        id: v.id || uid('s'),
        varianteId: v.varianteId || q.variantes[0].id,
        cantidad: int(v.cantidad, 1),
        precioUnitario: num(v.precioUnitario),
        fecha: v.fecha || q.fechaCompra
      };
    });
    if (!q.proveedorId && q.dondeLoCompre.trim()){
      q.proveedorId = proveedorPorNombre(q.dondeLoCompre).id;
    }
    return q;
  });
  out.gastos = out.gastos.map(function(g){
    return {
      id: g.id || uid('g'),
      concepto: g.concepto || '',
      monto: num(g.monto),
      categoria: g.categoria || 'Otros',
      fecha: g.fecha || today()
    };
  });
  out.ingresos = out.ingresos.map(function(i){
    return {
      id: i.id || uid('i'),
      concepto: i.concepto || '',
      monto: num(i.monto),
      fecha: i.fecha || today()
    };
  });
  return out;
}

// Gastos e ingresos juntos, del mas reciente al mas viejo, para el historial.
function movimientos(){
  var out = [];
  state.gastos.forEach(function(g){
    out.push({ tipo: 'gasto', id: g.id, concepto: g.concepto, monto: g.monto, categoria: g.categoria, fecha: g.fecha });
  });
  state.ingresos.forEach(function(i){
    out.push({ tipo: 'ingreso', id: i.id, concepto: i.concepto, monto: i.monto, categoria: '', fecha: i.fecha });
  });
  out.sort(function(a, b){ return String(b.fecha).localeCompare(String(a.fecha)); });
  return out;
}

function comprasDe(provId){
  var r = { prendas: 0, unidades: 0, gastado: 0 };
  state.products.forEach(function(p){
    if (p.proveedorId !== provId) return;
    r.prendas++;
    r.unidades += compradas(p);
    r.gastado += p.costo * compradas(p);
  });
  return r;
}

function money(v){
  var n = Math.round(num(v) * 100) / 100;
  var sign = n < 0 ? '-' : '';
  var p = Math.abs(n).toFixed(2).split('.');
  return sign + '$' + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
}

function esc(v){
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ---------- cantidades derivadas ----------
function compradas(p){
  return p.variantes.reduce(function(a, v){ return a + v.cantidad; }, 0);
}
function vendidas(p){
  return p.ventas.reduce(function(a, s){ return a + s.cantidad; }, 0);
}
function disponibles(p){
  return Math.max(0, compradas(p) - vendidas(p));
}
function vendidasDe(p, varianteId){
  return p.ventas.reduce(function(a, s){ return s.varianteId === varianteId ? a + s.cantidad : a; }, 0);
}
function stockDe(p, v){
  return Math.max(0, v.cantidad - vendidasDe(p, v.id));
}
function cobradoDe(p){
  return p.ventas.reduce(function(a, s){ return a + s.precioUnitario * s.cantidad; }, 0);
}
function gananciaDe(p){
  return p.ventas.reduce(function(a, s){ return a + (s.precioUnitario - p.costo) * s.cantidad; }, 0);
}
function etiquetaVariante(p, varianteId){
  for (var i = 0; i < p.variantes.length; i++){
    if (p.variantes[i].id === varianteId) return p.variantes[i].talla || 'sin talla';
  }
  return 'sin talla';
}

// Dinero del negocio = capital inicial - compras nuevas - gastos + ingresos + cobrado.
// La ropa marcada como stock inicial ya estaba pagada antes de empezar: no toca la caja.
// Los ingresos sueltos entran a la caja pero no cuentan como ganancia: normalmente es
// plata propia que se mete al negocio, y sumarla inflaria el beneficio falsamente.
function totals(){
  var t = {
    caja: 0, comprasNuevas: 0, valorStockInicial: 0, cobrado: 0,
    gastos: 0, ingresos: 0, gananciaBruta: 0, gananciaNeta: 0,
    invertidoEnStock: 0, unidadesStock: 0, unidadesVendidas: 0,
    prendasIniciales: 0
  };
  state.products.forEach(function(p){
    var costoTotal = p.costo * compradas(p);
    if (p.stockInicial){
      t.valorStockInicial += costoTotal;
      t.prendasIniciales++;
    } else {
      t.comprasNuevas += costoTotal;
    }
    t.cobrado += cobradoDe(p);
    t.gananciaBruta += gananciaDe(p);
    t.invertidoEnStock += p.costo * disponibles(p);
    t.unidadesStock += disponibles(p);
    t.unidadesVendidas += vendidas(p);
  });
  t.gastos = state.gastos.reduce(function(a, g){ return a + g.monto; }, 0);
  t.ingresos = state.ingresos.reduce(function(a, i){ return a + i.monto; }, 0);
  t.caja = state.capitalInicial - t.comprasNuevas - t.gastos + t.ingresos + t.cobrado;
  t.gananciaNeta = t.gananciaBruta - t.gastos;
  return t;
}

// Guarda el negocio entero como un solo documento en Firestore, compartido entre
// las cuentas autorizadas. No escribe nada hasta que llego el primer snapshot real
// (datosListos), para no pisar los datos de la otra persona con el estado vacio
// de arranque mientras se conecta.
function manejarErrorEscritura(err){
  if (err && err.code === 'permission-denied'){
    gateEstado = 'sin-acceso';
    renderGate();
    return;
  }
  toast('No se pudo guardar. Revisa tu conexion.');
}

// Escribe solo las entidades que cambiaron desde la ultima confirmacion del servidor,
// y borra las que desaparecieron. Evita reenviar el negocio completo en cada edicion.
function sincronizarColeccion(lista, col, espejoCol){
  var vistos = {};
  lista.forEach(function(item){
    vistos[item.id] = true;
    var serial = JSON.stringify(item);
    if (espejoCol[item.id] === serial) return;
    if (serial.length > LIMITE_DOC){
      toast('"' + (item.nombre || item.concepto || 'Un registro') + '" pesa mas de 1 MB. Quitale alguna foto.');
      return;
    }
    espejoCol[item.id] = serial;
    setDoc(doc(col, item.id), item).catch(function(err){
      delete espejoCol[item.id];
      manejarErrorEscritura(err);
    });
  });
  Object.keys(espejoCol).forEach(function(id){
    if (vistos[id]) return;
    delete espejoCol[id];
    deleteDoc(doc(col, id)).catch(manejarErrorEscritura);
  });
}

function save(){
  rememberTab();
  if (!datosListos || !usuario || migrando) return;

  var conf = JSON.stringify({ capitalInicial: state.capitalInicial });
  if (espejo.config !== conf){
    espejo.config = conf;
    setDoc(configRef, { capitalInicial: state.capitalInicial }).catch(function(err){
      espejo.config = null;
      manejarErrorEscritura(err);
    });
  }

  sincronizarColeccion(state.products, colProductos, espejo.productos);
  sincronizarColeccion(state.gastos, colGastos, espejo.gastos);
  sincronizarColeccion(state.ingresos, colIngresos, espejo.ingresos);
  sincronizarColeccion(state.proveedores, colProveedores, espejo.proveedores);

  archivarVersion();
}

// Copia para volver atras. Se guarda SIN fotos: son el 99% del peso, casi nunca es
// lo que hace falta recuperar, y con ellas cada copia chocaria contra el tope de 1 MB.
// Al restaurar, las fotos de las prendas que sigan existiendo se conservan.
function estadoSinFotos(){
  var copia = JSON.parse(JSON.stringify(state));
  copia.products.forEach(function(p){ p.fotos = []; });
  return copia;
}

// Se limita a una version por minuto para no duplicar trafico al editar seguido,
// y solo conserva las ultimas MAX_VERSIONES.
function archivarVersion(){
  var ahora = Date.now();
  if (ahora - ultimoArchivado < 60000) return;
  ultimoArchivado = ahora;

  var serial = JSON.stringify(estadoSinFotos());
  if (serial.length > LIMITE_DOC){ ultimoArchivado = 0; return; }

  addDoc(histRef, {
    datos: serial,
    fecha: new Date().toISOString(),
    autor: usuario ? usuario.email : '',
    prendas: state.products.length
  }).then(podarHistorial).catch(function(){
    // Que falle el historial nunca debe romper el guardado principal.
    ultimoArchivado = 0;
  });
}

function podarHistorial(){
  getDocs(query(histRef, orderBy('fecha', 'desc'))).then(function(snap){
    var docs = snap.docs;
    for (var i = MAX_VERSIONES; i < docs.length; i++){
      deleteDoc(docs[i].ref).catch(function(){});
    }
  }).catch(function(){});
}

function cargarHistorial(){
  histCargando = true;
  renderHistorial();
  getDocs(query(histRef, orderBy('fecha', 'desc'), limit(MAX_VERSIONES))).then(function(snap){
    histEntradas = snap.docs.map(function(d){
      var v = d.data();
      return { id: d.id, fecha: v.fecha || '', autor: v.autor || '', prendas: v.prendas, datos: v.datos };
    });
    histCargando = false;
    renderHistorial();
  }).catch(function(){
    histCargando = false;
    histEntradas = [];
    renderHistorial();
    toast('No se pudo cargar el historial.');
  });
}

function fechaLegible(iso){
  var d = new Date(iso);
  if (isNaN(d.getTime())) return iso;
  var mins = Math.floor((Date.now() - d.getTime()) / 60000);
  var rel;
  if (mins < 1) rel = 'recien';
  else if (mins < 60) rel = 'hace ' + mins + ' min';
  else if (mins < 1440) rel = 'hace ' + Math.floor(mins/60) + ' h';
  else rel = 'hace ' + Math.floor(mins/1440) + ' d';
  return d.getDate() + '/' + (d.getMonth()+1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' (' + rel + ')';
}

function renderHistorial(){
  var root = document.getElementById('hist-root');
  if (!histOpen){ root.innerHTML = ''; return; }

  var cuerpo;
  if (histCargando){
    cuerpo = '<div style="display:flex;justify-content:center;padding:30px"><div class="spinner"></div></div>';
  } else if (!histEntradas.length){
    cuerpo = '<div class="hint">Todavia no hay versiones guardadas. Se archiva una copia cada vez que cambias algo.</div>';
  } else {
    cuerpo = histEntradas.map(function(v, i){
      var armed = armedHist === v.id;
      var etiqueta = (i === 0 ? 'Version actual' : 'Version anterior');
      return '<div class="prov-card">'
        + '<div style="font-weight:700;font-size:13.5px">' + esc(etiqueta) + '</div>'
        + '<div class="prov-stats">' + esc(fechaLegible(v.fecha))
        + (v.autor ? ' &middot; ' + esc(v.autor.split('@')[0]) : '')
        + (typeof v.prendas === 'number' ? ' &middot; ' + v.prendas + ' prenda' + (v.prendas === 1 ? '' : 's') : '')
        + '</div>'
        + (armed
            ? '<div class="confirm-box" style="margin-top:10px"><div class="confirm-text">Se reemplaza todo el inventario por esta version. La version actual queda guardada en el historial, asi que puedes volver.<br><br>Las prendas que hoy existen conservan sus fotos. Una prenda que se haya borrado vuelve con todos sus datos pero <b>sin foto</b>: el historial no las guarda para no ocupar demasiado.</div>'
              + '<div class="confirm-actions"><button class="btn secondary" data-act="cancel-hist">Cancelar</button>'
              + '<button class="btn solid-danger" data-act="do-restore" data-value="' + esc(v.id) + '">Si, restaurar</button></div></div>'
            : '<button class="btn secondary" style="margin-top:10px" data-act="arm-hist" data-value="' + esc(v.id) + '">Restaurar esta version</button>')
        + '</div>';
    }).join('');
  }

  root.innerHTML = '<div class="modal-backdrop top" data-act="close-hist">'
    + '<div class="modal-sheet">'
    + '<div class="modal-handle"></div>'
    + '<div class="modal-head"><h2>Historial</h2><button class="modal-close" data-act="close-hist" aria-label="Cerrar">&times;</button></div>'
    + '<div class="hint" style="margin-bottom:14px">Cada cambio archiva una copia. Se guardan las ultimas ' + MAX_VERSIONES + '.</div>'
    + cuerpo
    + '</div></div>';
}

      + '<path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>'

    + '<div class="gate-text">No se pudo conectar. Revisa tu conexion e intenta de nuevo.</div>'
    + '<button type="button" class="btn secondary" style="width:auto;padding:11px 20px" data-act="reintentar">Reintentar</button></div>';

function marcarCargada(nombre){
  fuentesCargadas[nombre] = true;
  if (datosListos) return true;
  var faltan = FUENTES.some(function(f){ return !fuentesCargadas[f]; });
  if (faltan) return false;
  datosListos = true;
  gateEstado = null;
  renderGate();
  migrarSiHaceFalta();
  return true;
}

function refrescar(){
  // En la pestana Agregar no se reconstruye el formulario ante un cambio remoto,
  // para no borrar lo que la persona esta escribiendo en ese momento.
  if (tab === 'agregar') renderTopbar();
  else render();
}

// Cada coleccion se refleja en su parte del estado. El eco de nuestra propia
// escritura (hasPendingWrites) ya esta en pantalla, asi que no se reaplica.
function suscribirColeccion(col, nombre, campo, normalizar){
  return onSnapshot(col, function(snap){
    if (!snap.metadata.hasPendingWrites || !datosListos){
      var items = snap.docs.map(function(d){
        var v = d.data();
        v.id = d.id;
        return v;
      });
      espejo[nombre] = {};
      items.forEach(function(it){ espejo[nombre][it.id] = JSON.stringify(it); });
      state[campo] = normalizar ? normalizar(items) : items;
      state = migrate(state);
      // migrate() puede rellenar campos: el espejo debe reflejar lo que hay en el servidor,
      // no lo normalizado, para no disparar escrituras infinitas.
    }
    if (marcarCargada(nombre)) refrescar();
  }, errorDeDatos);
}

function suscribirDatos(){
  fuentesCargadas = {};
  datosListos = false;
  unsubs.forEach(function(u){ try{ u(); }catch(e){} });
  unsubs = [];

  unsubs.push(onSnapshot(configRef, function(snap){
    if (!snap.metadata.hasPendingWrites || !datosListos){
      var v = snap.exists() ? snap.data() : {};
      state.capitalInicial = num(v.capitalInicial);
      espejo.config = JSON.stringify({ capitalInicial: state.capitalInicial });
    }
    if (marcarCargada('config')) refrescar();
  }, errorDeDatos));

  unsubs.push(suscribirColeccion(colProductos, 'productos', 'products'));
  unsubs.push(suscribirColeccion(colGastos, 'gastos', 'gastos'));
  unsubs.push(suscribirColeccion(colIngresos, 'ingresos', 'ingresos'));
  unsubs.push(suscribirColeccion(colProveedores, 'proveedores', 'proveedores'));

  unsubscribeDatos = function(){
    unsubs.forEach(function(u){ try{ u(); }catch(e){} });
    unsubs = [];
  };
}

// Pasa el formato viejo (todo el negocio en negocio/datos) al nuevo (un documento por
// entidad). Solo corre si el formato nuevo esta vacio, asi que es seguro repetirla.
// El documento viejo NO se borra: queda como respaldo.
function migrarSiHaceFalta(){
  var vacio = !state.products.length && !state.gastos.length
    && !state.ingresos.length && !state.proveedores.length;
  if (!vacio) return;

  getDoc(docRef).then(function(snap){
    if (!snap.exists()) return;
    var viejo = migrate(snap.data());
    var total = viejo.products.length + viejo.gastos.length
      + viejo.ingresos.length + viejo.proveedores.length;
    if (!total) return;

    migrando = true;
    gateEstado = 'migrando';
    renderGate();

    var tareas = [];
    viejo.products.forEach(function(p){ tareas.push(setDoc(doc(colProductos, p.id), p)); });
    viejo.gastos.forEach(function(g){ tareas.push(setDoc(doc(colGastos, g.id), g)); });
    viejo.ingresos.forEach(function(i){ tareas.push(setDoc(doc(colIngresos, i.id), i)); });
    viejo.proveedores.forEach(function(v){ tareas.push(setDoc(doc(colProveedores, v.id), v)); });
    tareas.push(setDoc(configRef, { capitalInicial: viejo.capitalInicial }));

    Promise.all(tareas).then(function(){
      migrando = false;
      gateEstado = null;
      renderGate();
      toast('Datos migrados al formato nuevo: ' + viejo.products.length + ' prenda' + (viejo.products.length === 1 ? '' : 's') + '.');
    }, function(err){
      migrando = false;
      gateEstado = null;
      renderGate();
      manejarErrorEscritura(err);
      toast('La migracion no se completo. Tus datos viejos siguen intactos.');
    });
  }).catch(function(){});
}

});

function descargarRespaldo(){
  var datos = JSON.stringify(state, null, 2);
  var blob = new Blob([datos], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'mi-reventa-' + today() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  try{ localStorage.setItem(CLAVE_RESPALDO, String(Date.now())); }catch(e){}
  render();
  toast('Respaldo descargado. Guardalo en Archivos o iCloud.');
}

function restaurarRespaldo(file){
  var reader = new FileReader();
  reader.onerror = function(){ toast('No se pudo leer el archivo.'); };
  reader.onload = function(){
    var datos;
    try{
      datos = JSON.parse(reader.result);
    }catch(e){
      toast('Ese archivo no es un respaldo valido.');
      return;
    }
    if (!datos || !Array.isArray(datos.products)){
      toast('Ese archivo no tiene el formato de un respaldo.');
      return;
    }
    state = migrate(datos);
    openId = null; provOpen = false; armedGasto = null; armedProv = null;
    render(); save();
    toast('Respaldo restaurado: ' + state.products.length + ' prenda' + (state.products.length === 1 ? '' : 's') + '.');
  };
  reader.readAsText(file);
}

function toast(msg){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3400);
}

function shrink(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read')); };
    reader.onload = function(){
      var img = new Image();
      img.onerror = function(){ reject(new Error('decode')); };
      img.onload = function(){
        var scale = Math.min(1, 620 / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale));
        var h = Math.max(1, Math.round(img.height * scale));
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.6));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Cada prenda es su propio documento y Firestore admite 1 MB por documento, asi que
// el limite aplica por prenda (por sus fotos), no al negocio entero.
function avisoTamano(){
  var peor = null, peorBytes = 0;
  try{
    state.products.forEach(function(p){
      var b = JSON.stringify(p).length;
      if (b > peorBytes){ peorBytes = b; peor = p; }
    });
  }catch(e){ return ''; }
  if (peorBytes < AVISO_TAMANO) return '';
  var pct = Math.round(peorBytes / LIMITE_DOC * 100);
  return '<div class="check-row" style="cursor:default;margin-top:14px"><span style="font-size:19px">&#9888;</span>'
    + '<span><span class="ct">"' + esc(peor.nombre) + '" ocupa el ' + pct + '% del limite</span>'
    + '<span class="cs">Firestore permite 1 MB por prenda y las fotos son lo que mas pesa. Quitale alguna foto para poder seguir editandola.</span></span></div>';
}

function avisoRespaldo(){
  if (!hayDatos()) return '';
  var dias = diasDesdeRespaldo();
  if (dias === null){
    return '<div class="hint" style="margin-bottom:10px">Todavia no descargaste ningun respaldo desde este dispositivo.</div>';
  }
  return '<div class="hint" style="margin-bottom:10px">Ultimo respaldo desde este dispositivo: '
    + (dias === 0 ? 'hoy' : 'hace ' + dias + ' dia' + (dias === 1 ? '' : 's')) + '.</div>';
}

// Lee las filas de talla del DOM. Conserva los ids de las variantes que ya existian
// para que las ventas registradas sigan apuntando a la talla correcta.
function readTallaRows(containerId, prev, p){
  var container = document.getElementById(containerId);
  var out = [];
  if (!container) return prev || [];
  var rows = container.querySelectorAll('.talla-row');
  for (var i = 0; i < rows.length; i++){
    var vid = rows[i].getAttribute('data-vid');
    var talla = rows[i].querySelector('.t-name').value.trim();
    var cant = int(rows[i].querySelector('.t-qty').value, 1);
    if (cant < 1) cant = 1;
    if (vid && p){
      var minimo = vendidasDe(p, vid);
      if (cant < minimo) cant = minimo;
    }
    out.push({ id: vid || uid('v'), talla: talla, cantidad: cant });
  }
  // Ninguna variante con ventas puede desaparecer aunque falte su fila.
  if (p){
    p.variantes.forEach(function(v){
      var kept = out.some(function(o){ return o.id === v.id; });
      if (!kept && vendidasDe(p, v.id) > 0) out.push(v);
    });
  }
  if (!out.length) out = [{ id: uid('v'), talla: '', cantidad: 1 }];
  return out;
}

document.addEventListener('click', function(e){
  var tabBtn = e.target.closest('.tab-btn');
  if (tabBtn){ openId = null; askDelete = false; setTab(tabBtn.getAttribute('data-tab')); return; }

  var el = e.target.closest('[data-act]');
  if (!el) return;
  var act = el.getAttribute('data-act');
  var val = el.getAttribute('data-value');

  if (act === 'tab'){ setTab(val); return; }
  if (act === 'filter'){ filter = val; render(); return; }
  if (act === 'open'){ openId = val; askDelete = false; renderModal(); return; }
  if (act === 'close'){
    if (e.target !== el) return;
    openId = null; askDelete = false; renderModal(); return;
  }

  if (act === 'add-talla'){
    var box = document.getElementById(val);
    if (!box) return;
    box.insertAdjacentHTML('beforeend', tallaRowHTML(null, 0));
    return;
  }
  if (act === 'del-talla'){
    var row = el.closest('.talla-row');
    var parent = row.parentNode;
    if (parent.querySelectorAll('.talla-row').length <= 1){ toast('Tiene que quedar al menos una talla.'); return; }
    row.remove();
    return;
  }

  if (act === 'drop-draft'){
    drafts.splice(Number(val), 1);
    document.getElementById('f-strip').innerHTML = stripHTML(drafts, 'drop-draft');
    return;
  }
  if (act === 'drop-photo'){
    var pd = find(openId); if (!pd) return;
    pd.fotos.splice(Number(val), 1);
    document.getElementById('m-strip').innerHTML = stripHTML(pd.fotos, 'drop-photo');
    save(); return;
  }

  if (act === 'open-prov'){ provOpen = true; armedProv = null; renderProveedores(); return; }
  if (act === 'close-prov'){
    if (e.target !== el) return;
    cosecharProveedores();
    provOpen = false; armedProv = null;
    render(); save(); return;
  }
  if (act === 'add-prov'){
    var nom = document.getElementById('pv-nuevo').value.trim();
    if (!nom){ toast('Escribe el nombre del proveedor.'); return; }
    cosecharProveedores();
    var repetido = state.proveedores.some(function(v){ return v.nombre.trim().toLowerCase() === nom.toLowerCase(); });
    if (repetido){ toast('Ya tienes un proveedor con ese nombre.'); return; }
    state.proveedores.push({ id: uid('pr'), nombre: nom, contacto: document.getElementById('pv-nuevo-contacto').value.trim() });
    armedProv = null;
    render(); save(); toast('Proveedor "' + nom + '" agregado.');
    return;
  }
  if (act === 'save-prov'){
    cosecharProveedores();
    provOpen = false; armedProv = null;
    render(); save(); toast('Proveedores guardados.');
    return;
  }
  if (act === 'arm-prov'){ cosecharProveedores(); armedProv = val; renderProveedores(); return; }
  if (act === 'del-prov'){
    cosecharProveedores();
    var pr = proveedor(val);
    // Las prendas no se borran: conservan el nombre como texto y quedan sin proveedor.
    state.products.forEach(function(p){
      if (p.proveedorId === val){
        p.dondeLoCompre = pr ? pr.nombre : p.dondeLoCompre;
        p.proveedorId = null;
      }
    });
    state.proveedores = state.proveedores.filter(function(v){ return v.id !== val; });
    armedProv = null;
    render(); save(); toast('Proveedor "' + (pr ? pr.nombre : '') + '" borrado.');
    return;
  }

  // Cambia gasto/ingreso sin re-renderizar, para no perder lo ya tipeado.
  if (act === 'mov-tipo'){
    movTipo = val;
    var chips = el.parentNode.querySelectorAll('.chip');
    for (var ci = 0; ci < chips.length; ci++){
      chips[ci].setAttribute('aria-pressed', chips[ci].getAttribute('data-value') === val ? 'true' : 'false');
    }
    var esIng = val === 'ingreso';
    var wrap = document.getElementById('g-cat-wrap');
    if (wrap) wrap.hidden = esIng;
    var boton = document.querySelector('#gasto-form button[type="submit"]');
    if (boton) boton.textContent = esIng ? 'Ingresar a caja' : 'Anotar gasto';
    var concepto = document.getElementById('g-concepto');
    if (concepto) concepto.placeholder = esIng ? 'Puse dinero propio' : 'Anuncio en Instagram';
    return;
  }

  if (act === 'signin-google'){
    signInWithPopup(auth, new GoogleAuthProvider()).catch(function(err){
      if (err && (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request')) return;
      if (err && err.code === 'auth/popup-blocked'){
        toast('El navegador bloqueo la ventana. Permite ventanas emergentes para este sitio.');
        return;
      }
      toast('No se pudo iniciar sesion' + (err && err.code ? ' (' + err.code + ')' : '') + '.');
    });
    return;
  }
  if (act === 'signout'){ signOut(auth); return; }
  if (act === 'reintentar'){ location.reload(); return; }

  if (act === 'open-hist'){ histOpen = true; armedHist = null; cargarHistorial(); return; }
  if (act === 'close-hist'){
    if (e.target !== el) return;
    histOpen = false; armedHist = null; renderHistorial(); return;
  }
  if (act === 'arm-hist'){ armedHist = val; renderHistorial(); return; }
  if (act === 'cancel-hist'){ armedHist = null; renderHistorial(); return; }
  if (act === 'do-restore'){
    var entrada = null;
    histEntradas.forEach(function(v){ if (v.id === val) entrada = v; });
    if (!entrada){ toast('No se encontro esa version.'); return; }
    var datos;
    try{
      datos = JSON.parse(entrada.datos);
    }catch(err){
      toast('Esa version esta danada y no se puede restaurar.');
      return;
    }
    // El historial no guarda fotos: se reponen desde las prendas actuales que sigan existiendo.
    var fotosActuales = {};
    state.products.forEach(function(p){ fotosActuales[p.id] = p.fotos; });
    datos = migrate(datos);
    datos.products.forEach(function(p){
      if ((!p.fotos || !p.fotos.length) && fotosActuales[p.id]) p.fotos = fotosActuales[p.id];
    });
    state = datos;
    histOpen = false; armedHist = null;
    openId = null; provOpen = false;
    ultimoArchivado = 0;   // la version restaurada debe quedar archivada enseguida
    render(); save();
    toast('Restaurado: ' + state.products.length + ' prenda' + (state.products.length === 1 ? '' : 's') + '.');
    return;
  }

  if (act === 'respaldo'){ descargarRespaldo(); return; }

  if (act === 'arm-gasto'){ armedGasto = val; render(); return; }
  if (act === 'del-gasto'){
    var borrado = null;
    state.gastos = state.gastos.filter(function(g){
      if (g.id === val){ borrado = g; return false; }
      return true;
    });
    armedGasto = null;
    render(); save();
    toast('Gasto "' + (borrado ? borrado.concepto : '') + '" borrado.');
    return;
  }
  if (act === 'del-ingreso'){
    var borradoIng = null;
    state.ingresos = state.ingresos.filter(function(i){
      if (i.id === val){ borradoIng = i; return false; }
      return true;
    });
    armedGasto = null;
    render(); save();
    toast('Ingreso "' + (borradoIng ? borradoIng.concepto : '') + '" borrado.');
    return;
  }

  if (act === 'update'){
    var pu = find(openId); if (!pu) return;
    var nombre = document.getElementById('m-nombre').value.trim();
    var costo = parseFloat(document.getElementById('m-costo').value);
    var precio = parseFloat(document.getElementById('m-precio').value);
    if (!nombre || isNaN(costo) || isNaN(precio)){ toast('Completa nombre, costo y precio de venta.'); return; }
    pu.variantes = readTallaRows('m-tallas', pu.variantes, pu);
    pu.nombre = nombre;
    pu.proveedorId = resolverProveedor('m-prov');
    pu.costo = costo;
    pu.precioVenta = precio;
    pu.stockInicial = document.getElementById('m-inicial').checked;
    render(); save(); toast('Cambios guardados.'); return;
  }

  if (act === 'sell'){
    var ps = find(openId); if (!ps) return;
    var vid = document.getElementById('s-variante').value;
    var variante = null;
    ps.variantes.forEach(function(v){ if (v.id === vid) variante = v; });
    if (!variante){ toast('Elige una talla.'); return; }
    var cant = int(document.getElementById('s-cant').value, 0);
    var precioU = parseFloat(document.getElementById('s-precio').value);
    var fecha = document.getElementById('s-fecha').value || today();
    if (cant < 1){ toast('La cantidad tiene que ser 1 o mas.'); return; }
    var libre = stockDe(ps, variante);
    if (cant > libre){ toast('Solo quedan ' + libre + ' de esa talla.'); return; }
    if (isNaN(precioU)){ toast('Escribe el precio de venta.'); return; }
    ps.ventas.push({ id: uid('s'), varianteId: vid, cantidad: cant, precioUnitario: precioU, fecha: fecha });
    render(); save();
    toast('Venta registrada: ' + money(precioU * cant) + '.');
    return;
  }

  if (act === 'undo-venta'){
    var pv = find(openId); if (!pv) return;
    pv.ventas = pv.ventas.filter(function(s){ return s.id !== val; });
    render(); save(); toast('Venta deshecha.'); return;
  }

  if (act === 'ask-delete'){ askDelete = true; renderModal(); return; }
  if (act === 'cancel-delete'){ askDelete = false; renderModal(); return; }
  if (act === 'confirm-delete'){
    var borrada = find(openId);
    state.products = state.products.filter(function(x){ return x.id !== openId; });
    openId = null; askDelete = false;
    render(); save();
    toast('"' + (borrada ? borrada.nombre : 'Prenda') + '" eliminada.');
    return;
  }
});

    e.preventDefault();
    var concepto = document.getElementById('g-concepto').value.trim();
    var monto = parseFloat(document.getElementById('g-monto').value);
    var fechaMov = document.getElementById('g-fecha').value || today();
    if (!concepto || isNaN(monto)){ toast('Escribe el concepto y el monto.'); return; }
    if (movTipo === 'ingreso'){
      state.ingresos.unshift({ id: uid('i'), concepto: concepto, monto: monto, fecha: fechaMov });
      armedGasto = null;
      render(); save();
      toast('Ingreso de ' + money(monto) + ' sumado a la caja.');
      return;
    }
    state.gastos.unshift({
      id: uid('g'),
      concepto: concepto,
      monto: monto,
      categoria: document.getElementById('g-categoria').value,
      fecha: fechaMov
    });
    armedGasto = null;
    render(); save();
    toast('Gasto de ' + money(monto) + ' anotado.');
  }
});

document.addEventListener('change', function(e){
  // "Proveedor nuevo..." revela el campo para escribir el nombre.
  var campoNuevo = e.target.getAttribute && e.target.getAttribute('data-nuevo');
  if (campoNuevo){
    var input = document.getElementById(campoNuevo);
    if (input){
      var mostrar = e.target.value === '__nuevo__';
      input.hidden = !mostrar;
      if (mostrar) input.focus();
    }
    return;
  }
  if (e.target.id === 'f-restaurar'){
    if (e.target.files && e.target.files[0]) restaurarRespaldo(e.target.files[0]);
    return;
  }
  if (e.target.id === 'f-capital'){
    state.capitalInicial = num(e.target.value);
    render(); save(); return;
  }
  if (e.target.id === 'f-fotos'){
    addPhotos(e.target.files, function(urls){
      drafts = drafts.concat(urls);
      document.getElementById('f-strip').innerHTML = stripHTML(drafts, 'drop-draft');
    });
    return;
  }
  if (e.target.id === 'm-fotos'){
    var pf = find(openId); if (!pf) return;
    addPhotos(e.target.files, function(urls){
      pf.fotos = pf.fotos.concat(urls);
      var strip = document.getElementById('m-strip');
      if (strip) strip.innerHTML = stripHTML(pf.fotos, 'drop-photo');
      save();
    });
  }
});

renderGate();
})();
</script>
</body>
</html>
